# 엘로우 레터스

**평점 : ★★★☆ / 7.5**

## 이 영화를 본 이유

올해 부산국제영화제 첫날, 마지막 영화로 봤습니다. 베를린국제영화제 황금곰상 수상작이라는 점도 기대를 키웠네요. 국내 개봉도 예정되어 있어 극장에서 먼저 만날 기회가 반가웠습니다.

## 감독과 작품

일커 차탁 감독은 인물들이 제도와 권력에 부딪히는 과정을 그려 온 감독으로 알려져 있습니다. <더 티처스 라운지>는 아카데미 국제장편영화상 후보에 오르며 주목받았고, 학교라는 공간에서 진실과 책임의 문제를 다뤘습니다. <나는, 나는, 나는> 역시 인물의 관계와 사회적 조건을 함께 살핀 작품으로 소개됩니다.

<엘로우 레터스>는 독일·프랑스·튀르키예가 함께 만든 영화입니다. 튀르키예의 이야기를 독일에서 촬영했고, 베를린과 함부르크가 각각 앙카라와 이스탄불을 대신합니다. 베를린국제영화제 경쟁 부문에 초청돼 황금곰상을 받았습니다.

## 주요 스토리

앙카라의 연극계에서 이름을 알린 배우 데리야와 극작가이자 대학 교수인 아지즈는 딸 에즈기와 함께 안정된 생활을 하고 있습니다. 아지즈가 쓴 연극의 초연도 성공적으로 끝납니다. 하지만 공연 뒤 정부 관계자의 사진 촬영 요청을 데리야가 거절하고, 아지즈가 학생들에게 반정부 시위 참여를 권했다는 이유로 당국의 표적이 되면서 상황이 달라집니다.

아지즈는 대학에서 정직 처분을 받고, 데리야의 연극은 공연이 취소됩니다. 두 사람은 해고 통보를 받고 집까지 잃습니다. 결국 가족은 이스탄불에 있는 아지즈 어머니의 집으로 옮겨 갑니다. 아지즈는 택시 운전을 하며 생계를 잇고, 데리야는 가족의 생활비를 마련할 방법을 찾습니다.

데리야는 TV 드라마 출연을 알아보지만, 방송국 측은 그녀의 SNS에 올라온 정치적 게시물을 문제 삼습니다. 게시물을 지우지 않으면 출연이 어렵다는 조건을 듣고 처음에는 거부합니다. 그러나 생활이 빠듯해지면서 결국 게시물을 삭제하고, 자신들을 비판했던 방송국의 드라마 출연을 받아들입니다. 예술가로서 지켜 온 태도와 가족을 부양해야 하는 현실 사이에서 데리야는 고민합니다.

딸 에즈기도 부모의 갈등과 환경 변화에서 자유롭지 못합니다. 이사한 뒤에도 기타 레슨을 받으며 자기 생활을 이어가지만, 부모가 겪는 일과는 다른 방식으로 변화를 받아들입니다. 부모와 딸 사이에도 조금씩 거리가 생깁니다.

한편 아지즈는 자신들의 일을 바탕으로 새 연극 <엘로우 레터스>를 씁니다. 데리야는 작품의 주연을 맡아 연습을 시작하지만, 결국 안정적인 수입을 얻을 수 있는 TV 드라마를 선택합니다. 정치적 신념을 지키려는 아지즈와 생계를 위해 타협하는 데리야의 차이는 점점 커집니다.

제목의 ‘옐로우 레터스’는 해고나 계약 종료를 통보하는 노란색 공식 문서를 가리킵니다. 한 장의 통지서가 두 사람의 직업과 집, 가족 관계까지 흔드는 계기가 됩니다.

## 마지막 장면의 의미

데리야가 TV 드라마를 촬영하는 동안, 아지즈는 배우들이 대기하는 차 안에 혼자 남습니다. 그는 서 있다가 앉고, 마침내 눕습니다. 제게 이 장면은 아지즈가 무너지는 순서를 보여주는 장면이었습니다. 한 번 꺾인 사람은 끝까지 버티기보다, 결국 몸을 눕힐 만큼 편안한 자리부터 찾게 됩니다. 데리야의 타협을 지켜보는 아지즈 역시 그 세계에 조금씩 몸을 맞추고 있는 셈입니다.

## 감상

황금곰상을 받은 작품답게 비주얼과 이야기 모두 완성도가 높았습니다. 정치적 압박이 직장과 주거, 부부 관계를 차례로 흔드는 과정이 잘 연결되어 있었습니다. 독일의 도시를 튀르키예의 공간으로 설정한 방식도 영화의 주제를 넓혀 줍니다.

특히 영화 속 연극에서 배우들이 보여주는 연기가 무척 인상적이었습니다. 무대 위의 연기가 영화 속 인물들의 현실과 겹치면서, 억압과 저항의 무게를 전합니다.

이 영화도 영화제에서 수상하는 다른 유럽 영화들처럼 정치적인 문제에 조심스럽게 접근합니다. 그동안 여러 작품을 통해 문제를 이야기해 왔지만, 직접적으로 나서지 않는 이런 태도가 제 마음에 꼭 들지는 않았습니다. 그래도 이 정도의 거리 두기만으로도 의미는 있다고 생각합니다. 정치적 억압을 한 가족의 이야기로 옮긴 방식이 설득력 있고, 영화적 완성도도 뛰어난 작품이었습니다.
