형이 1.3억 정도 카드사에 채무가 있고 빚을 갚지 못해서 추징절차에 들어 가고 있어.
형과 형수는 공동명의로 아파트가 있는데 시가로 17억정도, 전세 준거 빼면 8-9억정도 재산이 있어.
형수는 학교 선생님이라 은퇴후에 연금을 받을수 있고, 형은 사실상 수입이 없는 상태.

형과 형수가 싸우고 형은 집을 나가서 연락이 두절된지 20일정도 됐고, 카드사에서는 추징 절차에 들어간다 통보가 왔어.
형수는 이혼을 하겠다 선언을 하고 있고, 1.3억에 대해 아버지에게 갚아달라 요구하고 있어.

형수의 주장으로는 현재 집에 대해서 형이 기여한바가 없기 때문에 다 본인 소유라고 주장하고 있는데 그게 맞아?
형수는 조카까지 대동해서 아버지 집에 찾아가 빚을 대신 갚으라고 요구하고 있는데 어떻게 대응하는게 좋을까?
내 짐작이지만 형수는 이미 변호사랑 상의를 하고 본인이 피해를 하나도 안보려고 하는것 같아.

형과 형수는 본인집이 아니라 전세집을 따로 구해서 살고 있고, 그 전세 자금은 어떻게 마련됬는지는 모르겠어.
부동산 등기부 등본을 보니 현재 형과 형수 소유의 집에 별도의 근저당이 잡혀있지는 않아

-----------
1. 형의 카드빚이 형 개인의 채무라면, 카드사는 형의 재산을 압류할 수 있다. 공동명의 아파트에서는 형의 지분이 대상이다. 형수가 보증을 섰거나 일상적인 가정생활에 필요한 거래로 연대책임을 지는 등 별도 사유가 있어야 형수의 재산에도 집행할 수 있다.

2. 현재 아파트가 공동명의라면, 형수가 매수대금을 전부 냈다는 사정만으로 형수의 100% 소유가 되는 것은 아니다. 이혼 시 재산분할에서는 초기 주거자금과 가사·양육 등 혼인 기간 전체의 기여를 고려한다. 실제로 남편이 **전체 분할대상 순재산의 45%를 받은 사례와 55%를 받은 사례**가 있다. 형의 구체적인 몫은 부부가 합의할 수 있고, 합의가 안 되면 법원이 정한다.

3. 형수가 공무원연금이나 사학연금 가입자라면, **연금 적용을 받는 교원 재직기간과 실질적인 혼인기간이 5년 이상 겹쳐야** 한다. 이혼 후 형수의 퇴직연금 수급권과 형의 수급연령 등 나머지 요건도 충족하면, 형은 그 혼인기간에 해당하는 연금액의 일부를 분할연금으로 받을 수 있다.
