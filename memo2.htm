일렉트로닉 뮤직 명반 가이드북

평점 : ★★★☆ / 7.0

<일렉트로닉 뮤직 명반 가이드북>을 읽었습니다. 

저자 이대화는 대중음악 전반을 폭넓게 다뤄온 음악 저널리스트로, 특히 전자음악 분야에서는 국내에서 가장 먼저 떠오르는 평론가 중 한 명입니다. 하우스와 테크노의 역사를 정리한 <백 투 더 하우스>, 2010년대 한국 일렉트로닉 댄스 신의 관계자 53명을 직접 인터뷰해 엮은 <댄스 뮤직 아카이브>를 펴내며 꼼꼼한 취재를 바탕으로 한 글쓰기를 보여왔습니다.

이중에서 저는 <백 투 더 하우스>를 무척 감명깊에 읽었는데, 새로운 책이 나왔다고 해서 읽게 되었네요.

이번 책에서는 1960년대 신시사이저 실험부터 2020년대 하이퍼팝까지, 기술의 발전이 바꿔온 전자음악의 흐름을 시대별 명반과 함께 안내합니다.

책에 소개된 음반과 뮤지션들을 다 적을수는 없고, 많은 장르의 음악들을 소개하는데 너무 많아서 그 장르들을 다 이해하기는 어렵더군요.
뭔가 정리가 됐다기 보다는 커다란 숙제를 던저준 책 같은 느낌입니다. 

책에 대한 감상 보다는 이 책에 소개된 장르와 용어들을 정리 하는것로 대신 해보려고 합니다. 정리하고 보니 16개나 되네요 ㅎㅎㅎ

1. 덥 (Dub)
1960년대 말 자메이카 레게에서 파생된 스타일로, 원곡의 보컬과 악기를 지우거나 걷어내고 베이스와 드럼을 강조하며 에코·리버브 같은 스튜디오 이펙트를 실험적으로 사용한 리믹스 기법입니다. 이후 정글, UK 개러지, 덥스텝 등 영국 전자음악 전반에 깊은 영향을 줬습니다. 대표 뮤지션으로는 킹 터비(King Tubby), 리 스크래치 페리(Lee "Scratch" Perry) 등이 있습니다.

2. 베를린 스쿨 (Berlin School)
1970년대 독일 베를린을 중심으로 발전한 전자음악 스타일로, 시퀀서로 만든 반복적인 리듬 패턴 위에 신시사이저의 장대하고 몽환적인 음향을 층층이 쌓아가는 긴 호흡의 구성이 특징입니다. 팝적인 훅보다는 실험적이고 명상적인 사운드스케이프를 추구하며, 이후 앰비언트와 신스웨이브 등에도 영향을 줬습니다. 대표 뮤지션으로는 탠저린 드림(Tangerine Dream), 클라우스 슐체(Klaus Schulze), 아쉬 라 템펠(Ash Ra Tempel) 등이 있습니다.

3. 앰비언트 / IDM
앰비언트는 1970년대 중후반 브라이언 이노가 개념화한 배경 음악적 성격의 전자음악으로, 멜로디보다 질감과 공간감에 집중합니다. IDM은 1990년대 초 여기에 복잡하고 실험적인 리듬 프로그래밍을 더한 감상용 전자음악으로, 워프 레코즈를 중심으로 성장했습니다. 대표 뮤지션으로는 브라이언 이노(Brian Eno), 에이펙스 트윈(Aphex Twin), 오토마(Autechre), 보즈 오브 캐나다(Boards of Canada) 등이 있습니다.

4. 신스팝 (Synth-pop)
1970년대 후반~1980년대 초 영국을 중심으로 등장한 장르로, 기타 등 전통 밴드 악기 대신 신시사이저와 드럼머신을 주된 사운드로 삼아 팝 곡을 만든 것이 특징입니다. 멜로디 중심의 대중적인 훅과 전자음향을 결합해 팝 시장에서 큰 성공을 거뒀습니다. 대표 뮤지션으로는 게리 뉴먼(Gary Numan), 디페시 모드(Depeche Mode), 유리스믹스(Eurythmics), 휴먼 리그(The Human League) 등이 있습니다. 크라프트베르크(Kraftwerk)는 신스팝 밴드라기보다 이 장르 전체에 결정적 영향을 준 선구자로 평가됩니다.

5. 하우스 (House)
1980년대 초중반 미국 시카고에서 시작된 장르로, 4/4박자의 일정한 킥드럼 비트("포 온 더 플로어")와 신스 베이스라인, 반복적인 루프가 특징입니다. 디스코의 계보를 이으며 전자 댄스음악의 근간이 됐습니다. 대표 뮤지션으로는 프랭키 너클스(Frankie Knuckles), 마샬 제퍼슨(Marshall Jefferson), 래리 허드(Larry Heard) 등이 있습니다.

6. 테크노 (Techno)
1980년대 중반 미국 디트로이트에서 발전한 장르로, 하우스보다 더 기계적이고 미니멀한 리듬, 반복적인 신스 패턴이 특징입니다. 인간미보다는 미래주의적·기계적 사운드를 지향하는 경향이 강합니다. 대표 뮤지션으로는 후안 앳킨스(Juan Atkins), 데릭 메이(Derrick May), 케빈 손더슨(Kevin Saunderson) 등이 있습니다.

7. 트립합 (Trip Hop)
1990년대 초 영국 브리스톨을 중심으로 등장한 장르로, 느린 힙합 브레이크비트에 재즈·소울 샘플, 어둡고 몽환적인 분위기를 결합한 것이 특징입니다. 춤보다는 감상에 가까운 음악으로, 보컬이 들어간 곡은 우울하고 영화적인 정서를 띠는 경우가 많습니다. 대표 뮤지션으로는 매시브 어택(Massive Attack), 포티쉐드(Portishead), 트리키(Tricky), DJ 섀도(DJ Shadow) 등이 있습니다. DJ 섀도는 샘플만으로 만든 앨범 《Endtroducing.....》(1996)로 유명하며, 인스트루멘털 힙합으로 분류되기도 합니다.

8. 정글 (Jungle)
1990년대 초 영국에서 등장한 장르로, 브레이크비트를 빠르게 쪼개고 재배치한 리듬(보통 160~180 BPM)에 자메이카 레게·덥의 베이스라인과 보컬 샘플을 결합했습니다. 이후 드럼앤베이스(Drum and Bass)로 정제·확장되며 발전했습니다. 대표 뮤지션으로는 골디(Goldie), 샤이 FX(Shy FX), 콩고 내티(Congo Natty) 등이 있으며, 드럼앤베이스로 발전하는 과정에서는 LTJ 부켐(LTJ Bukem), 로니 사이즈(Roni Size)가 대표적입니다.

9. 프로그레시브 하우스 (Progressive House)
1990년대 초 영국에서 등장한 하우스의 하위 장르로, 짧은 훅 반복 대신 곡 전체에 걸쳐 점진적으로 요소를 쌓아가고 변화시키는 긴 전개 구조가 특징입니다. 트랙 길이가 길고, 분위기의 점층적 고조를 중시합니다. 대표 뮤지션으로는 사샤(Sasha), 존 디그웨드(John Digweed), 딥 디쉬(Deep Dish) 등이 있습니다. 2010년대 EDM에서 쓰는 "프로그레시브 하우스"(스웨디시 하우스 마피아 등)는 이름은 같지만 사운드가 상당히 다릅니다.

10. UK 개러지 (UK Garage)
1990년대 중반 미국 개러지 하우스가 영국에서 변형되며 생겨난 장르로, 싱코페이션(당김음)이 강한 리듬과 스킵 비트, R&B 느낌의 보컬 샘플을 결합했습니다. 이후 투스텝, 덥스텝, 그라임 등으로 계보가 이어졌습니다. 대표 뮤지션으로는 아트풀 다저(Artful Dodger), 크레이그 데이비드(Craig David) 등이 있습니다.

11. 빅 비트 (Big Beat)
1990년대 중반 영국에서 등장한 장르로, 묵직한 브레이크비트에 록의 에너지, 왜곡된 신스와 베이스, 펑크·힙합 샘플을 결합한 것이 특징입니다. 클럽 음악과 록 음악 팬을 동시에 끌어들이며 1990년대 후반 전자음악이 주류 차트에 진입하는 데 큰 역할을 했습니다. 대표 뮤지션으로는 케미컬 브라더스(The Chemical Brothers), 프로디지(The Prodigy), 팻보이 슬림(Fatboy Slim) 등이 있습니다. 프로디지는 초기에는 레이브·브레이크비트 하드코어 사운드로 출발했습니다.

12. 프렌치 하우스 (French House)
1990년대 중후반 프랑스에서 등장한 하우스의 하위 장르로, 디스코·펑크 샘플을 반복하면서 필터를 열고 닫아 사운드를 변화시키는 기법이 특징입니다. 흥겹고 복고적인 그루브가 강해 "필터 하우스"라고도 불립니다. 대표 뮤지션으로는 다프트 펑크(Daft Punk), 카시우스(Cassius), 스타더스트(Stardust), 모조(Modjo) 등이 있습니다. 다프트 펑크는 이후 신스팝, 디스코 등으로 영역을 넓혀 장르를 넘어선 영향력을 가졌습니다.

13. 투스텝 (2-Step Garage)
1990년대 후반 UK 개러지에서 갈라져 나온 하위 장르로, 기존 4/4박 킥드럼 대신 킥을 불규칙하게 배치해 리듬에 빈 공간을 만드는 것이 특징입니다. 이 "스킵감" 있는 리듬 구조가 이후 덥스텝 탄생의 토대가 됐습니다. 대표 뮤지션으로는 MJ 콜(MJ Cole), 우키(Wookie), 뎀 2(Dem 2), 와일드차일드(Wildchild) 등이 있습니다.

14. EDM (Electronic Dance Music)
2010년대 초 미국에서 대형 페스티벌과 클럽 중심의 전자 댄스음악을 통칭하며 널리 쓰이게 된 용어로, 특정 장르라기보다 일렉트로 하우스, 빅룸 하우스, 브로스텝 등을 포괄하는 우산 개념입니다. 곡 중간에 긴장감을 쌓았다가 한꺼번에 터뜨리는 "빌드업-드롭" 구조와 팝 보컬과의 협업이 특징입니다. 대표 뮤지션으로는 아비치(Avicii), 스크릴렉스(Skrillex), 데이비드 게타(David Guetta), 캘빈 해리스(Calvin Harris) 등이 있습니다.

15. 하이퍼팝 (Hyperpop)
2010년대 중반 PC 뮤직(PC Music) 레이블을 중심으로 등장해 2010년대 후반 장르로 자리잡았으며, 팝의 구조를 극단적으로 과장하고 왜곡한 것이 특징입니다. 오토튠을 인위적으로 강조한 보컬, 지나치게 밝고 반짝이는 신스 사운드, 장르 경계를 파괴하는 편곡을 사용합니다. 대표 뮤지션으로는 소피(SOPHIE), A. G. 쿡(A. G. Cook), 100 gecs, 찰리 XCX(Charli XCX) 등이 있습니다.

16. 멜로딕 테크노 (Melodic Techno)
2010년대 중반부터 본격적으로 형성된 테크노의 하위 장르로, 하드하고 미니멀한 리듬 위에 서정적이고 감성적인 멜로디·화성을 얹은 것이 특징입니다. 앰비언트적 신스 레이어와 점진적으로 고조되는 빌드업 구조를 사용하며, 최근 페스티벌·클럽 신에서 주류로 자리잡았습니다. 대표 뮤지션으로는 테일 오브 어스(Tale of Us), 슈테판 보드진(Stephan Bodzin), 아드리아티크(Adriatique) 등이 있습니다.
