# 이창동 감독 <가능한 사랑> 리뷰

평점 : ★★★★ / 8.5

이창동 감독의 신작이 오랜만에 나왔습니다. <버닝> 이후 8년 만이네요. 기다린 시간이 길었던 만큼 개봉 소식이 반가웠습니다.

베니스 영화제 수상 소식도 컸습니다. <가능한 사랑>은 제83회 베니스국제영화제에서 심사위원대상(은사자상)을 받았습니다. 한국 영화가 이 상을 받은 건 처음이라고 하네요. 평론가들 반응도 좋아서 더 궁금했습니다.

이창동 감독은 소설가 출신입니다. 영화 연출을 시작하기 전에 이미 문단에서 활동했습니다. 문화관광부 장관을 지낸 이력도 있습니다.

주요 작품은 <초록물고기>, <박하사탕>, <오아시스>, <밀양>, <시>, <버닝>입니다. 작품 수가 많지 않습니다. 대신 한 편 한 편의 무게가 있습니다. 공통점이 있다면 인물의 고통을 쉽게 위로하지 않는다는 점입니다. 불편한 질문을 끝까지 붙들고 가는 감독이죠.

그런데 이런 감독의 신작도 한국에서는 투자를 받기 어려웠다고 합니다. 처음에는 영화진흥위원회 중예산 제작지원 사업에 선정돼 15억 원을 지원받을 예정이었는데, 나머지 제작비를 댈 국내 투자사를 찾지 못했다고 하네요. 상업성이 걱정된다는 이유였다고 합니다. 결국 제작사가 영진위 지원을 스스로 반납하고 넷플릭스와 손을 잡았습니다. 감독 본인은 넷플릭스가 제작 과정에서 아무 간섭도 하지 않았고, 지금까지 중 가장 편하게 작업했다고 말했다고 하네요. 한국에서는 9월 23일 극장에서 먼저 개봉했고, 11월 6일 넷플릭스에 공개될 예정입니다. 

## 스토리 라인
호석(설경구)은 대기업 공장의 용접공이었습니다. 평생 자부심을 갖고 일했지만 구조조정으로 해고됐습니다. 이후 몸도 마음도 무너진 채 살아갑니다. 아내 미옥(전도연)은 마스크 공장에서 일하며 남편과 열 살 아들 철을 돌봅니다.

어느 날 동료의 장례식장에서 다큐멘터리 감독 예지(조여정)를 만납니다. 예지는 해고 노동자에 대한 다큐멘터리를 준비 중입니다. 미옥은 인터뷰에 선뜻 응합니다. 호석은 거부합니다. 예지는 호석의 마음을 열려고 남편 상우(조인성)의 해변 별장으로 함께 여름휴가를 가자고 제안합니다.

상우는 부유한 투자자입니다. 여유 있고 다정한 사람입니다. 이렇게 두 부부가 한 공간에 머물게 됩니다. 가까워질수록 서로 간의 거리도 선명해집니다. 영화는 현재와 과거를 오갑니다. 파업 현장과 호석·미옥의 젊은 시절이 교차하며 이야기가 쌓입니다.

영화를 보는 내내 두 사건이 떠올랐습니다. 하나는 쌍용자동차 사태입니다. 대량 해고, 공장 점거 파업, 경찰의 강제 진압, 그리고 이어진 해고자와 가족들의 죽음. 영화 속 파업 장면은 이 사건을 그대로 연상시킵니다. 다른 하나는 한진중공업 사태입니다. 호석이 일했던 회사 이름이 'SP중공업'이고, 그의 직업이 용접공이라는 점에서 크레인 위에 올랐던 한 용접공의 얼굴이 겹쳐 보였습니다. 현실이 영화의 바닥에 단단히 깔려 있습니다.

영화 속 예지는 다큐멘터리 감독입니다. 그녀의 카메라는 호석의 상처를 찍고 싶어 합니다. 하지만 호석은 카메라를 거부합니다. 카메라가 가까이 올수록 오히려 입을 닫습니다.

여기서 이 영화의 질문이 보입니다. 타인의 고통을 기록하는 일은 누구를 위한 것일까요. 다큐멘터리는 사실을 담을 수 있습니다. 하지만 카메라 앞에서 사람은 늘 조금씩 연기하게 됩니다. 속마음과 욕망, 부부 사이의 사랑 같은 건 카메라로 잡기 어렵습니다.

극영화는 그 안쪽으로 들어갈 수 있습니다. 현실의 노동자를 다시 카메라 앞에 세우지 않고도 그들의 내면을 상상할 수 있습니다. 동시에 다큐멘터리를 찍는 사람의 시선까지 비출 수 있습니다. 이창동 감독은 수상 소감에서 노동이 사라지고 사람 사이의 관계가 끊어지는 시대에 영화가 무엇을 할 수 있는지 묻고 싶었다고 했습니다. 이 영화가 극영화여야 했던 이유가 거기에 있다고 생각합니다.

호석과 미옥의 아들 철이는 말이 많지 않습니다. 또래보다 행동이 느린 아이로 나옵니다. 대신 어른들을 봅니다. 부모의 다툼, 부자 부부의 친절, 그 사이의 어색한 공기를 가만히 지켜봅니다.

철이는 관객의 자리에 가깝습니다. 판단하지 않고 보기만 합니다. 동시에 다음 세대이기도 합니다. 부모의 계급과 상처를 그대로 물려받을지도 모르는 아이입니다. 철이 무언가를 바라보는 장면마다 그 질문이 조용히 따라옵니다.

상우는 악당이 아닙니다. 예의 바르고 친절합니다. 아내의 다큐멘터리 작업도 돕습니다. 별장을 내어주고 호석 가족을 환대합니다. 그런데 그 환대가 가능한 건 그가 가진 것이 많기 때문입니다. 별장도, 여유도, 친절도 모두 자본에서 나옵니다. 오늘날의 자본이 딱 이런 얼굴입니다. 폭력적이지 않고 세련됐죠.

눈여겨볼 장면이 하나 더 있습니다. 상우는 휴가 중에도 개인적으로 진행하는 프로젝트를 챙깁니다. 그리고 그 프로젝트는 결국 성공합니다. 영화는 이 프로젝트가 정확히 무엇인지 자세히 말하지 않습니다. 그런데 보다 보면 자연스럽게 추측하게 됩니다. 혹시 그 대상이 SP중공업은 아닐까? 아니면 SP중공업 직원들과 비슷한 처지에 놓일 또 다른 누군가는 아닐까? 

한쪽에서는 해고된 노동자의 이야기를 카메라에 담고 있습니다. 같은 시간 다른 쪽에서는 투자자의 거래가 조용히 성사됩니다. 누군가의 성공이 누군가의 해고로 이어지는 구조가 한 장면 안에 겹쳐 보였습니다. 상우가 친절할수록 이 대비가 더 차갑게 느껴졌습니다. 

영화는 '남의 것을 탐하지 말라'는 문장으로 시작합니다. 이 문장은 상우에게 이어지는것까요? 미옥에게 이어지는걸까요? 스포일러라 자세히 말할수는 없지만 저는 둘 다에게 해당되는것 같습니다. 


## 개인적인 감상

이창동 감독의 영화는 소설적이라는 말을 자주 듣습니다. 저도 동의합니다. 이 감독은 이미지나 데쿠파주로 밀어붙이는 사람은 아닙니다. 인물과 대사, 이야기의 구조로 승부합니다. 한 장면의 화면보다 영화 전체가 남기는 질문이 더 오래 갑니다.

그래도 이 감독은 영화로 만들 가치가 있는 이야기를 합니다. 그게 이창동 영화를 계속 기다리게 되는 이유입니다. 특히 AI 시대에 노동과 자본을 이야기하는 건 너무나 적절하다고 생각합니다. 노동이 사라진다는 말이 흔해진 지금, 사라지는 쪽에 선 사람들을 다시 보게 합니다.

솔직히 새롭지 않은 장면도 있습니다. 나체로 수영하며 자유를 느끼는 장면은 전작 <버닝>을 떠올리게 했습니다. 해 질 녘 옷을 벗고 춤추던 해미의 모습이 겹쳤습니다. 보름달을 매개로 사랑과 그리움을 이야기하는 방식도 익숙합니다. 달을 노래한 시인 이태백이 자연스럽게 떠오르더군요.

하지만 새롭지 않은 걸 다루면서도 이 영화 안에서는 그런 장면들이 잘 작동합니다. 익숙한 이미지인데 인물의 사연과 만나니 다르게 보입니다. 오래 쓰인 상징도 제자리에 놓이면 힘이 생긴다는 걸 보여줍니다.

엔딩도 이야기하고 싶습니다. 자세히 말할 수는 없지만, 올해 본 영화 중 가장 인상적인 엔딩이었습니다. 크게 무언가를 터뜨리지 않습니다. 조용히 끝납니다. 그런데 극장을 나와서도 한동안 그 장면이 머리에 남았습니다. 러닝타임이 164분인데 기다린 보람이 있는 마무리였네요.

영화를 끝까지 다보고 나니 호석,미옥 부부는 이제 무언가 하나의 문제가 해결되고 다음 단계로 넘어가겠구나 하는 생각이 들어서 좋았습니다. 반대로 예지는 이 영화를 결국 완성하지 못하겠구나, 상우는 또 여전히 그렇게 살아가겠구나 하는 생각이 들더군요.

다 좋은데 찜찜한 게 한가지 있습니다. 영화는 AI 시대에 노동이 사라진다고 말하면서 현장 노동자의 이야기를 다룹니다. 그런데 제가 보기에 AI 때문에 먼저 사라질 노동자는 사무실 내근직입니다. 문서를 쓰고, 정리하고, 분석하는 일부터 대체되고 있으니까요. 제가 보기엔 용접공보다 사무직이 먼저일 가능성이 높아 보입니다.

물론 아직은 누구도 확실하게 예측하기는 힘든 이야기 이기는 합니다. 누구 생각이 맞을지는 앞으로 두고 보면 알게 되겠죠. ^^
