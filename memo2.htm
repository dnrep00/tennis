# 첫 세계 — 윤단비 감독의 두 번째 장편

평점 : ★★★★ / 8.0

윤단비 감독의 <첫 세계>를 봤습니다. 

올해 부산국제영화제에서 제가 티켓팅에 성공한 작품 중에서 가장 기대했던 영화였습니다. 윤단비 감독의 전작 <남매의 여름밤>을 감명 깊게 봐서 다음 작품을 오래 기다렸거든요.

기대가 너무 커서 혹시 실망하면 어쩌나 하는 마음도 있었습니다. 다행히, 정말 다행히 이번 작품도 좋았습니다. ㅎㅎ

윤단비 감독은 장편 데뷔작 <남매의 여름밤>에서 한 가족이 머무는 집과 그 안에 쌓인 시간을 담았습니다. 일상의 작은 순간을 따라가며 인물 사이의 거리를 보여주는 감독입니다. 두 번째 장편 <첫 세계>에서는 시선을 섬마을의 십 대에게 옮겼습니다.

제작은 퍼스트 스텝이 맡았고, 주연은 심수빈과 김어진 배우입니다. 심수빈 배우가 진을, 김어진 배우가 두재를 연기합니다. 영화는 소완도에서 촬영했다고 합니다. 

심수빈 배우는 <첫 세계>의 오디션에서 진이 엄마와 대화하는 장면을 연기했다고 합니다. 명랑하고 통통 튀는 시골 소녀 진을 꼭 연기하고 싶어 열심히 준비했고, 연기를 마치자 윤단비 감독이 “귀엽다”고 했다고 하네요. 그 말이 좋은 뜻인지 고민하던 중 캐스팅 소식을 듣고 무척 기뻤다고 합니다. 촬영 전에는 자전거 타는 법도 익혔습니다. GV에서 윤단비 감독이 말한바에 의하면, 할머니 역은 섬 주민들 가운데 노래를 가장 잘하는 할머니를 수소문해 캐스팅했다고 합니다. ㅋ

## 영화의 이야기

<첫 세계>는 육지와 다리로 이어지지 않은 섬에서 살아가는 열일곱 살 진의 여름을 그립니다. 영화는 할머니의 이야기로 시작합니다. 진이 사는 섬의 풍경과 주민들의 일상이 차분히 펼쳐지고, 그 안에서 진의 생활도 모습을 드러냅니다. 진에게 섬은 익숙한 집이자 매일 마주하는 세계입니다.

그러던 중 할머니의 장례를 위해 두재가 섬으로 돌아옵니다. 두재는 진의 어린 시절 친구입니다. 오랜만에 다시 만난 두 사람 사이에는 반가움과 서먹함이 함께 있습니다. 어린 시절과는 달라진 서로를 마주하면서 진은 두재에게 점점 마음을 빼앗깁니다.

진은 그동안 알지 못했던 감정과 욕망을 처음으로 경험합니다. 누군가를 향한 마음은 설렘만 주는 것이 아니라, 혼란과 서운함도 불러옵니다. 진은 두재를 바라보며 상대의 마음을 궁금해하고, 동시에 자기 안에서 일어나는 변화를 알아갑니다. 그 여름을 지나면서 익숙했던 섬과 사람들도 이전과는 조금 다르게 보이기 시작합니다.

영화는 큰 사건을 앞세우기보다 진이 보내는 하루와 섬의 생활을 따라갑니다. 인물들의 말과 행동, 서로를 대하는 방식이 조금씩 달라지는 모습을 지켜보게 되네요. 제목의 의미도 설명으로 제시하기보다, 진이 처음 겪는 감정과 그로 인해 흔들리는 세계를 따라가며 천천히 드러납니다.

이야기의 끝에는 할머니의 일기가 놓입니다. 시작을 할머니의 이야기로 열고 마지막을 일기로 맺으면서, 진의 여름은 할머니가 지나온 시간과 연결됩니다. 진의 경험을 모두 설명하지 않으면서도 한 사람의 기억이 다음 세대의 이야기에 닿는 구조입니다. 스포일러가 될수 있으니 구체적인 결말은 밝히지 않겠습니다. 영화가 보여주는 감정의 변화를 직접 따라가며 보는 편이 좋을것 같습니다.

제목인 ‘첫 세계’는 처음 마주하는 감정만을 가리키지 않는 듯합니다. 할머니가 처음 시집왔을 때 마주한 세계와, 지금 진과 두재가 처음 건너는 세계가 영화 안에서 겹쳐집니다.

그 장면들을 보며 자연스럽게 아이들의 첫 세계를 생각하게 됩니다. 이어서 아버지와 어머니에게도 처음 마주한 세계가 있었을 테고, 할머니에게도 그때만의 세계가 있었겠지요. 그 세계들이 서로 다른 세대의 시간으로 이어집니다.

시작과 끝을 할머니의 이야기로 감싸는 구성이 너무 좋았습니다. 진의 여름은 할머니의 오래된 기억과 나란히 놓이고, 한 사람의 첫 세계가 다음 세대의 이야기를 비추는 것처럼 느껴집니다.

많이 기대했는데 이번에도 좋은 작품을 만들어주셔서 윤단비 감독에게 고마웠습니다. 이 감독에게는 소포모어 콤플렉스도 비껴가는구나 싶었습니다. 두 번째 장편에서도 자기 시선을 잃지 않았습니다.

다만, 아쉬운 점은 사운드였습니다. 배우들의 대사가 명료하게 들리지 않는 장면이 몇 군데 있었습니다. 영화제 상영에서는 영어 자막을 보고 내용을 따라간 순간도 있었네요. 정식 개봉 때는 이 부분이 보완되면 좋겠습니다. 저예산 한국 영화에서 사운드가 어려운 문제라는 점은 알고 있습니다. 제작 환경을 생각하면 간단한 일은 아니겠지만요.

두 편을 보고 나니 다음 작품도 기다려집니다. <남매의 여름밤>을 만든 윤단비 감독, <같은 속옷을 입는 두 여자>의 김세인 감독, <벌새>의 김보라 감독의 후속작을 기다리고 있었는데, 그중 하나는 먼저 만났네요. 다른 두 감독의 신작들도 어서 보고 싶습니다.

그전에 <첫 세계>가 극장에서 빨리 개봉해 많은 관객을 만났으면 좋겠습니다. 흥행 대박을 기원합니다. ㅎㅎㅎ
