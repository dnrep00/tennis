<에코 체임버> 리뷰

평점 : ★★☆ / 5.5

<에코 체임버>는 올해 부산국제영화제에서 처음 본 영화입니다. 며칠 전 해외뉴스에서 수잔 서랜든이 팔레스타인 가자지구 문제와 관련한 시위에서 발언하는 모습을 봤습니다. 사회활동가로도 꾸준히 목소리를 내 온 배우죠. 그런 수잔 서랜든이 오랜만에 영화에 출연한다는 소식이 반가워 예매를 하게 되었네요

이 영화의 감독인 안드레아 팔라오로 감독은 <메데아스>, <한나>, <모니카> 등을 연출했습니다. 인물의 감정을 대사로 설명하기보다 표정과 침묵, 공간을 통해 보여주는 편이라고 합니다. 사람들 사이의 관계 안에 쌓인 상처, 고립된 인물의 내면을 차분하게 따라가는 편이라고 합니다. 

이번 작품은 베르나르도 베르톨루치가 시작한 미완의 프로젝트를 바탕으로 합니다. 베르톨루치는 이리아나 베르나르디니, 루도비카 람폴디와 함께 시나리오를 썼고, 그가 세상을 떠난 뒤 안드레아 팔라오로 감독이 작품을 이어받아 영화로 완성했습니다. 팔라오로 감독에게도 처음으로 자신이 처음부터 구상하지 않은 시나리오를 연출한 작품이라고 합니다.

영화는 음악 프로듀서 레오(루카 마리넬리)의 위기에서 출발합니다. 그는 만성적인 통증을 안고 살아가며 약물에 의존합니다. 성공한 프로듀서로 보이지만, 사적인 삶은 불안정합니다. 영화는 레오의 현재와 과거를 오가며 그가 어떻게 지금의 상황에 이르렀는지 보여줍니다.

물리치료사 앤(알리시아 비칸데르)은 레오의 집을 방문해 통증 치료를 돕습니다. 처음에는 치료사와 환자로 만난 두 사람이지만, 둘 사이에는 곧 감정이 생깁니다. 앤은 레오를 돌보며 가까워지고, 두 사람은 연인이 됩니다. 하지만 앤의 보살핌은 레오에게 안정감을 주는 동시에 의존을 키우기도 합니다. 친밀함과 통제, 돌봄과 집착의 경계가 조금씩 흐려집니다.

두 사람은 서로에게 끌리면서도 편안하게 함께 있지 못합니다. 가까워졌다가 멀어지고, 관계를 끊으려 하면서도 다시 서로를 찾습니다. 영화는 이 과정을 시간 순서대로만 보여주지 않습니다. 지나간 순간과 현재가 교차하면서, 두 사람이 서로에게 남긴 기억과 상처가 반복해서 드러납니다. 한 공간에 함께 있어도 마음은 엇갈리고, 부재한 사람의 흔적은 방 안에 남습니다.

레오는 가수 에이바(수잔 서랜든)의 새 앨범 작업도 맡고 있습니다. 오랜 경력을 지닌 에이바는 다시 음악을 만들기 위해 레오와 협업합니다. 그녀의 노래와 목소리는 레오의 집 안을 채우며 영화 곳곳에 이어집니다. 에이바는 레오와 앤의 관계에 직접 개입하기보다, 두 사람의 이야기를 비추는 또 다른 인물로 자리합니다. 음악을 통해 기억과 감정을 마주하는 사람이며, 레오에게는 일의 동료이자 창작자로서 자신을 돌아보게 하는 상대이기도 합니다.

레오와 앤, 에이바의 이야기는 사랑과 의존, 창작과 고통을 함께 바라봅니다. 누군가를 돌보는 일이 언제부터 상대를 붙잡는 일이 되는지, 함께 만든 기억이 관계를 어떻게 계속 붙들어 두는지를 묻습니다. 

사실 완성도가 아주 높은 작품이라고 생각하지는 않습니다. 인물의 감정과 관계를 따라가다 보면 이야기의 흐름이 느슨하게 느껴지는 구간도 있습니다. 베르톨루치 시절에 시작된 이야기라서 그런지, 전체적으로 올드하게 느껴지는 건 어쩔 수 없었습니다. 오래된 감정 표현이나 관계의 방식이 지금의 관객에게는 약간은 진부하게 다가올 수도 있을것 같습니다.

그래도 영화의 시작을 알리는 음악이 무척 좋았습니다. 음악을 다루는 영화답게 전반에 흐르는 곡들도 마음에 들었습니다. 다만 여담을 보태자면 수잔 서랜든의 노래가 제 취향에 맞지는 않았습니다. 그래도 오랜만에 보는 배우들이 반가워 즐겁게 관람했습니다. <마틴 에덴>에서 봤던 루카 마리넬리와 알리시아 비칸데르를 볼 수 있어서도 좋았습니다.

이런 영화는 영화제가 아니면 만나기 쉽지 않을 것 같습니다. 그런 점에서 저에게는 의미 있는 작품이었습니다.
