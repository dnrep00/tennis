# <스파이럴> 후기｜4000명이 함께 본 부산의 야외 상영

평점 : ★★★☆ / 7.0

<스파이럴>은 이번 부산국제영화제 오픈시네마 부문에 선정돼 야외 상영을 했습니다. 시간이 조금 남아서 고른 영화였는데, 결과적으로는 아주 좋은 선택이었네요.

영화의 전당 야외극장에서 4,000여 명이 한자리에 모여 같은 영화를 봤습니다. 큰 화면과 열린 공간, 함께 웃고 숨죽이는 관객들. 영화의 좋고 나쁨을 떠나 오래 동안 기억에 남을것 같습니다. 

본 영화 상영 전에 시나리오 작가와 배우가 참석한 GV도 열렸습니다. 감독은 이탈리아 개봉 일정 때문에 부산에 오지 못했다고 합니다. 현장에서 4,000명이 자기 영화를 보는 모습을 직접 봤다면 얼마나 감동했을까 싶었어요.

## 감독과 작품 소개

파올로 스트리폴리는 장르영화를 바탕으로 가족과 사회의 균열을 그려온 이탈리아 감독이라고 합니다. 로베르토 데 페오와 함께 연출한 <어 클래식 호러 스토리>로 이름을 알렸고, 이후 <플로잉>과 <더 홀리 보이>에서도 공포와 심리극을 섞은 작품을 해왔다고 합니다. 

<스파이럴>은 이탈리아·프랑스·벨기에가 함께 만든 작품입니다. 이탈리아 배우들이 주로 출연해서 잘 알지 못하는 배우들이 대부분 이었습니다. GV에 온 배우는 딸 역을 맡은 배우였는데, 실제 나이가 17살이라는 이야기를 듣고 깜짝 놀랐네요. ㅋㅋ

## 영화의 주요 스토리

부유한 집안의 엄마 안나는 오랜만에 딸 앨리스의 집을 찾아옵니다. 폭풍우가 몰아치는 날, 갑작스럽게 나타난 엄마는 가족이 오랫동안 숨겨온 이야기를 꺼냅니다. 앨리스는 엄마의 고백을 들으며 자신이 알고 있던 가족의 과거가 사실과 다를 수 있다는 걸 알게 됩니다.

이야기는 과거로 거슬러 올라갑니다. 어린 앨리스가 개에게 물려 다리를 잃을 위기에 처하자, 안나는 딸을 살리기 위해 정체를 알 수 없는 낯선 여자와 거래를 합니다. 간절한 마음으로 내린 선택이지만, 거래에는 대가가 따릅니다. 안나는 그 대가를 감당하려고 다시 선택을 거듭하고, 그때마다 가족은 조금씩 다른 방향으로 흔들립니다.

영화는 안나와 앨리스의 대화를 중심으로 가족의 시간을 되짚습니다. 과거의 사건은 부모와 자녀, 형제자매의 관계에 차례로 영향을 미칩니다. 겉으로는 부족함 없어 보이는 가족이지만, 각자의 삶에는 감춰진 불안과 상처가 쌓여 있습니다. 안나가 처음 내린 선택은 한 사람의 문제에 머무르지 않고 가족 전체를 끌어들이게 됩니다.

낯선 여자와의 거래가 무엇을 의미하는지, 가족이 치러야 할 대가는 무엇인지 영화는 조금씩 보여줍니다. 비밀이 드러날수록 인물들은 과거의 일을 외면하기 어려워지고, 이야기는 점점 더 어두운 방향으로 흘러갑니다. 제목처럼 한 번 시작된 선택의 결과가 다음 선택을 부르고, 가족은 그 흐름에서 빠져나오려 애씁니다.

## 개인적인 감상

이 영화를 우리나라로 치면 <기생충> 같은 이야기라고 홍보하던데, 어떤 면에서는 그 말이 이해됐습니다. 다만 가족 사이의 비밀과 감정이 크게 얽히면서 전개되는게 아침 드라마 같은 느낌도 있습니다.

확실한 건 이야기에 몰입하게 하는 힘입니다. 스토리가 진행될수록 영화 안으로 빨려 들어갈것 같은 기분이 들었습니다. ^^

GV에서 작가와 배우가 이탈리아에서는 응원할 때 이렇게 한다며 관객들에게 팔을 X자로 만들어 달라고 했습니다. 다 같이 그 동작을 하고 사진도 찍으며 웃었는데, 영화를 보고 나니 그 동작이 영화 속에서 악마와의 거래를 받아들이는 장면이었더군요. ㅋㅋㅋ

 그 사실을 알고 나니 현장에서의 추억이 더 묘해졌습니다. 악마와 거래를 해버렸으니 이 영화 홍보도 열심히 해야겠네요. 이 영화는 국내 수입이 확정됐다고 하니 우리나라 극장에서도 조만간 볼 수 있을것 같습니다. 이탈리아에서는 10월 8일 개봉했습니다. 더 많은 분들이 보고 흥행에도 좋은 결과가 있으면 좋겠습니다. ^^
