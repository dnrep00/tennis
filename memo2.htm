# <홈랜드 엘레지> - 아야드 악타르

평점: ★★★★ / 8.0

이번에도 어김없이 누군가의 추천으로 읽었습니다. 근데 누가, 어디서 추천했는지는 전혀 기억이 안 납니다. 이렇게 책이 하나씩 쌓이는 것 같습니다. ㅋㅋ

아야드 악타르는 파키스탄 이민자 가정에서 태어난 미국 작가입니다. 소설 <아메리칸 더비쉬>로 먼저 이름을 알렸고, 이후 희곡 <디스그레이스드>로 퓰리처상을 받았다고 합니다.  그 외에도 <더 후 앤드 더 왓>, <인비저블 핸드>, <정크> 같은 희곡을 썼습니다. 정체성, 종교, 자본주의, 인종 문제를 자기 경험에서 끌어와 반복해서 다루는 작가로 알려져 있습니다.

<홈랜드 엘레지>는 그의 두 번째 소설입니다. 화자 이름이 작가 본인과 똑같고, 배경도 상당 부분 실제와 겹칩니다. 그래서 소설집이 아니라 한 권의 장편소설, 그중에서도 오토픽션(자전적 소설)으로 보는 게 맞아 보입니다.

전체 구성은 서곡으로 시작해서 코다로 끝나고, 그 사이에 크게 세 부분으로 나뉩니다.

1) 가족 정치

아버지와 어머니 이야기로 시작합니다. 아버지는 심장 전문의였고, 한때 트럼프를 환자로 진료한 적도 있습니다. 트럼프 당선 이후 아버지가 그를 지지하게 되는 과정과, 화자 자신의 9/11 이후 정체성 혼란을 함께 다룹니다. 가족이라는 사적인 공간을 통해 미국 정치를 들여다보는 구성입니다.

2) 스크랜턴 회고록

스크랜턴이라는 지역에서 겪은 인종차별 경험이 중심입니다. 차가 고장 나서 겪은 일, 경찰에게 받은 취급 같은 일화가 나옵니다. 동시에 리아즈라는 부유한 무슬림 투자자와의 관계를 통해 돈과 자본이 미국 사회에서 어떻게 작동하는지도 보여줍니다.

3) 폭스 아메리카나 (원제: Pox Americana)

원제는 '팍스 아메리카나(Pax Americana, 미국 주도의 평화)'를 비튼 표현입니다. 평화 대신 역병을 넣은 겁니다. 이 부분에서는 화자 자신의 인종, 성, 종교에 대한 내밀한 이야기가 나옵니다. 남을 향한 비판이 아니라 자기 자신의 편견까지 들여다보는 구간입니다. 아버지의 의료소송 이야기로 이어지면서, 아버지가 믿었던 미국식 성공 신화가 무너지는 과정을 그립니다.

이번 책은 제가 한 번도 생각해보지 않은 각도의 이야기를 많이 들려줬습니다. 무슬림 이민자 가정에서 자란 사람의 시선으로 미국을 보는 경험이 낯설었습니다. 작가가 자기 자신을 다 벗겨 놓고 쓴다는 느낌을 받았습니다. 가족의 비밀, 본인의 편견, 부끄러운 순간까지 숨기지 않습니다. 그 솔직함이 이 책의 제일 큰 힘이라고 생각합니다.

글을 잘 씁니다. 무거운 주제를 다루는데도 지루하지 않게 읽힙니다. 한쪽 입장만 말하지 않는 점도 좋았습니다. 자신과 생각이 다른 사람들이 왜 그렇게 생각하게 됐는지도 꽤 자세히 풀어줍니다. 일방적인 주장이 아니라 이해를 시도하는 태도가 느껴지네요.

트럼프 시대 미국의 혼란을 이렇게 가까이서, 이렇게 솔직하게 보여주는 책은 흔치 않죠. 그래서 저는 이 작품이 참 좋은 작품이라는 생각이 들었습니다.
