평점 : ★★★☆ / 7.0

작년에 개봉한 애니메이션 <룩백>을 정말 좋게 봤습니다. 그래서 고레에다 히로카즈 감독이 실사판을 만든다는 소식도 오래전부터 알고 있었어요. 다만 두 이름이 잘 어울린다는 생각은 들지 않았습니다. 처음 들었을 때 살짝 놀랐네요.

올해 부산국제영화제에서 상영한다는 것도 알고 있었습니다. 그런데 상영이 1회차뿐이었고, 시간이 맞지 않았어요. 국내 개봉이 곧 이어진다는 걸 알고 있어서 아쉬움은 크지 않았습니다. 그렇게 이번 주에 극장에서 보게 되었네요.

사실 이유가 하나 더 있습니다. 최근 부산영화제 관련 검색을 많이 했더니 인스타그램에 <룩백> 피드가 끝없이 뜨더라고요. 이쯤 되면 안 볼 수가 없습니다. 영화를 보기도 전에 배우들과 내적 친밀감부터 생겨버렸어요. ㅋㅋㅋ

## 감독과 작품 이력

고레에다 히로카즈 감독은 워낙 유명하니 소개는 넘어가겠습니다.

대신 이 작품의 근황만 짧게 적어둘게요. <룩백>은 올해 베니스국제영화제 경쟁 부문에 초청되었습니다. 하지만 황금사자상을 비롯한 공식 경쟁 부문 수상까지는 이어지지 못했어요. 영화제 외부 단체가 주는 부대 상 몇 개를 받는 데 그쳤습니다.

일본에서는 9월 11일에 개봉했습니다. 첫 3일 성적이 애니메이션판의 60% 남짓에 머물렀고, 이후에도 반등하지 못했다고 하네요. 흥행에는 실패하고 있는 것 같습니다. 국내는 10월 8일에 개봉했는데, 아직 어떨지 모르겠어요.

## 주요 스토리

배경은 일본 아키타의 작은 마을입니다. 초등학교 4학년 후지노는 학교 신문에 4컷 만화를 연재하고 있어요. 반에서는 그림 잘 그리는 아이로 통합니다. 본인도 그걸 꽤 즐기고 있고요.

그러던 어느 날, 선생님이 신문 지면 한 칸을 다른 학생에게 내줍니다. 학교에 나오지 않고 집에만 있는 쿄모토라는 아이예요. 쿄모토의 그림을 본 후지노는 충격을 받습니다. 실력 차이가 너무 분명했거든요. 자존심이 상한 후지노는 그날부터 그림에만 매달립니다.

시간이 흘러 졸업식 날, 후지노는 졸업장을 전해주러 쿄모토의 집에 가게 됩니다. 그곳에서 두 사람은 처음 마주해요. 그리고 쿄모토가 사실은 후지노 만화의 열렬한 팬이었다는 걸 알게 됩니다. 이 만남을 계기로 두 사람은 함께 만화를 그리기 시작합니다. 한 명은 이야기와 인물을, 한 명은 배경을 맡아서요. 그렇게 둘은 서로의 세계가 되어 갑니다. 하지만 각자 원하는 길이 조금씩 달라지는 순간도 찾아오죠. 그 뒤의 이야기는 직접 확인하시는 게 좋겠습니다.

큰 줄거리는 애니메이션과 거의 같습니다. 차이는 주로 디테일에 있어요.

먼저 러닝타임이 다릅니다. 애니메이션은 58분, 실사판은 100분이에요. 늘어난 40분여는 가족과 학교 같은 일상 장면으로 채워졌습니다. 후지노의 부모님, 선생님, 쿄모토의 할머니처럼 주변 인물의 비중이 커졌어요. 애니메이션이 두 소녀에게 집중했다면, 실사판은 두 사람이 사는 세계 전체를 보여주는 쪽에 가깝네요.

카메라의 거리도 다릅니다. 실사판은 인물을 한발 떨어진 롱숏으로 담는 장면이 많아요. 아키타의 논길, 신사 계단, 눈 덮인 풍경도 자주 등장합니다. 게다가 전편을 필름으로 촬영해서, 화면의 질감부터 애니메이션과 확실히 다릅니다.

리듬에도 차이가 있습니다. 애니메이션은 짧고 강렬했어요. 반면 실사판은 느리고 차분합니다. 늘어난 장면들이 이야기를 촘촘하게 만들어주긴 하지만, 원작의 생생한 기운은 조금 옅어졌다는 평도 있어요. 저도 어느 정도는 공감했습니다.


## 개인적인 감상

애니메이션이 워낙 강렬하고 잘 만든 수작이었습니다. 그러다 보니 보는 내내 자꾸 비교하게 되더라고요. 그런데 다 보고 나니 이건 결이 다른 영화라는 생각이 들었습니다.

원작은 만화지만, 화면 곳곳에 고레에다 히로카즈의 개성이 많이 묻어납니다. 가족의 일상, 느린 호흡, 아이들의 표정을 오래 바라보는 시선 같은 것들이요. <룩백>이라는 이야기를 빌려 온 고레에다 영화라는 느낌이 강했습니다.

배우들도 인상적이었어요. 어린 시절을 연기한 나나세 후리와 오카다 로카, 성인 시절의 데구치 나츠키와 마키타 아쥬까지 다들 너무 사랑스럽습니다. 아역에서 성인으로 넘어가는 흐름도 자연스러웠고요. 캐스팅을 정말 잘했다는 생각이 들었습니다.

그래도 저는 애니메이션 쪽이 훨씬 좋습니다. 다만 실사판은 실사판대로 의미가 있는 작품이라고 생각해요.

그렇지만 끝까지 납득하기 어려운 부분이 하나 있었습니다. 후반부에 애니메이션으로 전환되는 장면이에요. 연출 의도는 짐작이 갑니다. 하지만 이럴 거면 왜 실사로 만들었는지, 이건 정말 이해가 안 됐어요. 실사만으로 끝까지 밀고 가는 모습을 보고 싶었네요.

아무튼 결국 이 영화를 봤습니다. 덕분에 이제 인스타에 뜨는 <룩백> 피드들을 마음 놓고 즐길 수 있게 되었어요. 그게 제일 기쁩니다.
