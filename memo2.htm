부서진 마음들의 마을 (도널 라이언)

평점: ★★★ / 6.5

정확히 기억은 안 납니다만, 누군가 추천을 해서 알게 된 책입니다. 최근 클레어 키건을 비롯한 아일랜드 작가들 작품이 여기저기서 소개되고 있어서 자연스럽게 관심이 갔네요.

도널 라이언은 아일랜드 작가입니다. 이 작품이 그의 데뷔작입니다. 데뷔작으로 부커상 후보에 올랐고 여러 문학상을 받았다고 합니다. 아일랜드 시골 마을과 그 안의 사람들을 담담하게 그리는 작가로 알려져 있습니다.

이 작품의 원제는 <더 스피닝 하트>입니다. 한국에 제목과는 사뭇 다릅니다. 이야기의 배경은 아일랜드 경제 위기 직후입니다. 켈틱 타이거로 불리던 호황이 끝나고 건설 붐도 함께 무너진 시기입니다. 마을의 부동산 개발업자 포키 버크가 파산하고 도망치면서 이야기가 시작됩니다.

이야기 구조가 꽤 특이합니다. 장마다 화자가 바뀝면서 스무 명이 넘는 인물이 각자 한 장씩 맡아 자기 이야기를 합니다. 심지어 죽은 사람의 시선까지 등장합니다. 한 사람의 목소리가 끝나면 다음 사람이 이어받는 식입니다. 시점도 입장도 계급도 다 다릅니다. 실직한 건설 노동자, 버림받은 아내, 이주 노동자, 마을 노인까지 다양합니다.

이렇게 흩어진 목소리들을 따라가다 보면 하나의 그림이 그려집니다. 경제 붕괴가 한 마을 사람들의 삶을 어떻게 흔들었는지, 그 여파가 누구에게 어떤 식으로 닿았는지가 조각조각 맞춰집니다. 사건 하나를 여러 각도에서 보게 되는 구성입니다.

하지만, 솔직히 저는 이 작품이 크게 와닿지는 않았습니다. 화자가 너무 자주 바뀌다 보니 정보들이 머릿속에서 잘 정리가 안 돼네요. 누가 누구와 무슨 관계인지 헷갈리는 순간이 계속 있었고, 그래서 감정적으로 몰입하기 전에 정보 처리하는 데 에너지를 더 쓴 느낌입니다.

이건 작가 문제라기보다 제 문제인 것 같기도 합니다. 집중해서 촘촘히 읽었으면 다르게 느꼈을 수도 있었을것 같네요. 그래도 시도 자체는 흥미로웠습니다. 한 사건을 이렇게 많은 시선으로 쪼개서 보여주는 방식이 완전히 새로운건 아니지만 그렇다고 또 흔한 방식은 아니니까요.
