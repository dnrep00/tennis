# 빵과 책 (Midday Meal) – 마지드 마지디

평점 : ★★★★ / 8.5

마지드 마지디 감독의 <빵과 책>을 봤습니다. 

올해 부산국제영화제에서 본 마지막 영화였습니다. 큰 기대는 하지 않았습니다. 그런데 기대보다 훨씬 좋았네요. 남은 자리가 없어서 맨 앞줄 좌석을 예매했습니다. 영화 볼 때는 고개가 좀 아팠지만 GV 때는 감독님을 바로 앞에서 볼 수 있었습니다. 이건 정말 좋았네요 ㅋㅋ

GV까지 다 보고 나오니 돌아가는 기차 시간이 지나 있었습니다. 결국 기차표를 다시 구했습니다. 이것도 영화제의 추억이라고 생각하려고요 ㅋㅋ


## 감독과 작품 이야기

마지드 마지디는 이란을 대표하는 감독입니다. 우리나라에서는 <천국의 아이들>로 잘 알려져 있습니다. 이 작품은 이란 영화 최초로 아카데미 외국어영화상 후보에 올랐습니다.

이후 <천국의 미소>, <바란>, <참새들의 합창> 같은 작품을 만들었습니다. 가난한 사람들, 특히 아이들의 시선으로 세상을 보는 영화가 많습니다. 힘든 현실을 다루지만 끝까지 사람에 대한 따뜻함을 놓지 않는 것이 특징이네요. 비전문 배우를 자주 기용하는 감독이기도 합니다.

<빵과 책>은 마지디의 열한 번째 장편입니다. 베니스 경쟁부문에 올랐던 <태양의 아이들> 이후 6년 만의 신작이고요. 마지디가 부산국제영화제를 찾은 것도 이번이 처음이라고 합니다.

영화는 133분 분량의 이란 영화입니다. 각본은 마지디와 후만 베흐마네시가 함께 썼고, 베흐마네시는 촬영도 맡았습니다. 제작은 이란 어린이청소년지능개발원(카눈)이 했습니다. 제31회 부산국제영화제 경쟁부문에서 10월 9일 처음 공개됐습니다.

출연 배우들은 대부분 비전문 배우입니다. 이란 남부에서만 촬영했고, 유명 배우 없이 현지 사람들로 캐스팅했습니다. 주인공 솔란을 연기한 모하마드 라히미 역시 비전문 배우인데, 연기가 정말 자연스럽습니다. 해외 평단에서도 그의 연기에 대한 칭찬이 많네요.

10월 9일 첫 상영 전 무대인사에서 감독이 한 발언이 이란 현지 매체에 보도됐다고 합니다. 마지디는 이번 상영을 이란 국민과 미나브에서 희생된 아이들에게 바친다고 말했습니다. 그는 미국과 이스라엘이 일으킨 전쟁 첫날 아이 168명이 희생됐다고 언급했습니다. 영화 내용과 직접 연결되진 않지만, 지금 이란의 상황을 떠올리게 하는 대목이었네요.


## 주요 스토리

아직 우리나라 개봉 소식은 없습니다. 그래서 스포일러 신경 쓰지 않고 그냥 이야기하겠습니다.

배경은 이란 남동부의 메마른 마을 구란케시입니다. 호르무즈 해협에서 멀지 않은 차바하르 지역입니다. 다부드 솔란은 이 마을 학교의 유일한 교사입니다. 임시 계약직인 그는 학기가 끝나는 석 달 뒤 정규직이 될 예정입니다. 그 돈으로 어머니와 살 집을 마련하는 게 꿈이고요.

문제는 점심 급식입니다. 급식은 정부가 아니라 한 후원자의 돈으로 운영됐는데, 그 후원자가 세상을 떠납니다. 유족은 후원을 이어갈 생각이 없습니다. 아이들은 사실 공부보다 점심 때문에 학교에 옵니다. 급식이 끊기면 아이들이 안 오고, 학교는 문을 닫게 됩니다. 정규직의 꿈도 함께 사라지죠.

교육청은 도움 대신 수업을 계속하라는 지시만 내립니다. 솔란은 집 보증금을 빼서 학교로 이사합니다. 그리고 낮에는 교사로, 밤에는 기름 밀수꾼으로 이중생활을 시작합니다. 이 지역에서는 아이들까지 연료 밀수를 할 만큼 흔한 일입니다.

솔란은 처음엔 좋은 사람입니다. 아이들을 돌보고, 아픈 마을 사람에게 주사를 놔주고, 일꾼들과 빵을 나눕니다. 하지만 상황은 점점 그를 바꿉니다. 다른 마을 아이를 받는 걸 망설이고, 손님에게 음식을 내준 어머니에게 화를 냅니다. 은행 대출 보증을 부탁한 사람에게서는 이제 착한 일 하던 시절은 끝났다는 말을 듣습니다.

그러다 아픈 노인 한 명이 솔란에게 맡겨집니다. 솔란은 노인을 돌보면서 관객에게도 쉽게 드러내지 않는 선택을 이어갑니다. 그리고 노인을 위해 무덤까지 미리 파 둡니다. 그런데 이야기는 엉뚱한 곳으로 흘러갑니다. 늘 곁을 지키던 어머니가 위태로워지고, 노인을 위해 판 무덤에 어머니가 들어갈 수도 있는 상황이 됩니다.

그 사이 학교에는 감사가 나옵니다. 깐깐해 보이던 감사관은 솔란의 진심을 알아보고 나름대로 돕기로 합니다. 영화는 메마른 산을 비추며 시작해서, 작은 수확이 이뤄지는 푸른 채소밭을 내려다보며 끝납니다.


이 영화에서 점심 한 끼는 단순한 음식이 아니라고 생각합니다. 먹을 권리, 그리고 국가가 돌보지 않는 곳에서 그것을 지키기 위한 싸움에 관한 이야기입니다. 교육청은 수업만 하라고 하고 밥은 책임지지 않습니다. 결국 한 개인이 그 빈자리를 메우다 무너지죠.

솔란은 자기 밀수가 큰돈 버는 밀수업자들에 비하면 사소하다고, 목적도 따져야 하지 않느냐고 말합니다. 영화는 여기에 답을 주지 않습니다. 제도가 실패한 곳에서 선행과 해악이 분리될 수 있는지 관객에게 묻고 끝납니다.

노인을 위해 판 무덤도 의미가 있어 보입니다. 남을 위해 준비한 자리가 내 가족의 자리가 될 수도 있다는 설정이니까요. 솔란이 계산하고 준비한 것들이 결국 자신에게 돌아온다는 상징처럼 읽혔습니다.

첫 장면과 마지막 장면의 대비도 눈에 띕니다. 황량한 산에서 시작해 푸른 밭의 작은 수확으로 끝납니다. 모든 걸 잃어가는 과정 끝에도 무언가는 자란다는 이야기로 받아들일수도 있을것 같습니다.

초중반은 이란 영화 특유의 느린 호흡으로 갑니다만, 후반부에 이야기가 휘몰아칩니다. 이 후반부가 정말 인상적이었네요.

아쉬운 점도 살짝 있습니다. 어머니를 너무 이상화하고 대상화한 게 아닌가 싶었습니다. 어머니는 묵묵히 아들 곁을 지키는 존재로만 그려집니다. 페미니스트인 제 입장에서 보자면 너무 스테레오타입 같은 느낌이 들기는 했습니다. 그래도 이걸 감안해도 올해 본 베스트 영화 후보에 충분히 올라갈 만한 작품입니다.

한글 제목은 좀 이상하게 느껴졌습니다. 영어 제목은 'Midday Meal'입니다. 이란어 원제 'Ghazaye nimroz'도 '점심 식사'라는 뜻입니다. 영화의 핵심도 점심 한 끼입니다. 그런데 <빵과 책>이라니, 왜 이렇게 지었는지 궁금하네요.

이 영화는 올해 경쟁부문 출품작입니다. 부산국제영화제는 올해 아카데미 국제장편영화상 출품 자격을 얻었습니다. 대상을 받으면 내년 오스카에 공식 출품할 수 있을 것 같습니다. 아직 수상 결과는 나오지 않았지만, 대상을 받았으면 좋겠네요.

우리나라 수입사도 정해져서 많은 분들이 봤으면 좋겠습니다. 기회가 된다면 저도 한 번 더 보고 싶네요.
