<라 페라> 후기: 떠나간 존재를 붙잡으려는 마음

평점 : ★★★ / 6.0

<라 페라>는 올해 부산국제영화제에서 두 번째로 본 영화입니다. 보고 싶은 작품은 많았지만 티켓팅에 성공했고, 한국에서 정식 개봉할지는 알기 어려운 작품이라 선택했습니다.

무엇보다 제목부터 제 관심을 끌었습니다. 영화를 보고 나니 왠지 저와 인연이 닿는 작품 같다는 생각도 들었네요.

도밍가 소토마요르 카스틸로 감독은 칠레의 감독이자 시나리오 작가입니다. 가족과 공동체 안의 관계를 큰 사건보다 인물들의 표정과 일상으로 천천히 관찰하는 편이라고 합니다. 인물이 놓인 장소와 풍경도 이야기의 중요한 부분으로 다루는 특징이 있다고 합니다. 

장편 데뷔작 <De jueves a domingo>는 가족 여행을 아이의 시선으로 따라가고, <Mar>는 가족 사이의 가까움과 불편함을 살피는 영화로 알려져 있습니다. <Tarde para morir joven>은 칠레의 한 공동체에서 살아가는 사람들의 관계를 그리는데 이 작품으로 로카르노영화제 감독상을 받았다고 합니다. 

<라 페라>에서도 인물의 감정을 대사로 설명하기보다 바람과 바다, 섬의 생활 속에 놓아둡니다. 과거와 현재가 뚜렷한 구분 없이 이어지는 방식도 감독의 특징과 맞닿아 있는것 같네요.


영화의 스토리는 이렇습니다. 

실비아는 칠레 남부의 외딴섬에서 파트너 마리오와 살며 해조류를 채취해 생계를 이어갑니다. 어느 날 어부들이 바다에서 구조한 강아지 한 마리를 데려옵니다. 실비아는 강아지에게 멕시코 가수의 이름을 따 "유리"라고 붙입니다.

유리는 실비아의 조용한 생활에 들어와 빈자리를 채웁니다. 아이가 없는 실비아는 유리에게 애정을 쏟으며, 한동안 접어 두었던 모성에 대한 마음도 다시 느끼게 됩니다. 하지만 유리는 실비아가 원하는 대로 곁에만 머무는 강아지가 아닙니다. 섬을 돌아다니고, 자기 방식대로 살아갑니다.

새해 밤, 폭죽에 놀란 유리가 사라집니다. 실비아가 유리를 찾아 해안 동굴을 헤매면서 영화는 그녀의 어린 시절 기억으로 넘어갑니다. 어릴 적 실비아는 섬을 방문한 가족의 아들 니콜라스와 동굴에 갔다가, 그가 바다에 휩쓸려 사라지는 일을 겪었습니다. 실비아는 니콜라스를 구하지 못했다는 죄책감을 오래 품고 살아왔습니다. 영화는 그날의 일을 과거와 현재에 걸쳐 보여주지만, 실비아가 느끼는 죄책감과 실제 책임을 하나의 설명으로 정리하지는 않습니다.

유리는 돌아오지만, 둘의 관계는 예전 같지 않습니다. 유리는 새끼들을 낳고도 돌보지 않고, 실비아는 새끼들을 챙기다 지쳐 갑니다. 결국 실비아는 유리와 새끼들을 다른 사람에게 보내기로 합니다. 유리를 잃지 않으려 붙잡던 사람이 이번에는 먼저 놓아주는 선택을 하는 셈입니다.

실비아가 어릴 때 겪은 니콜라스의 실종은 유리의 실종과 겹쳐집니다. 과거에 누군가를 잃은 기억이 현재의 관계에 스며들고, 실비아는 유리를 지키려는 마음과 자기 뜻대로 곁에 두려는 마음 사이에서 흔들립니다.

그런 점에서 유리는 실비아에게 아이를 대신하는 존재라기보다, 그녀가 억눌러 온 애정과 상실감이 드러나는 계기처럼 보입니다. 실비아가 유리를 놓아주는 일이 과거의 상처까지 해결했다는 뜻은 아닙니다. 영화는 그녀가 완전히 치유됐다고 말하지 않고, 상처를 안은 채 다음 시간을 살아갈 수 있을지를 남겨 둡니다. 마지막의 바다 위 불은 실제 섬의 가스 누출 현상과 연결된 장면입니다. 동시에 묻혀 있던 기억과 감정이 다시 타오르는 이미지로도 읽히네요.

전반적으로 흥미롭게 봤습니다. 특히 실비아의 과거 기억이 강아지의 실종과 겹치며 드러나는 방식이 좋았습니다. 유리를 단순히 주인공의 상처를 치유하는 존재로만 그리지 않는 점도 인상적이었습니다.

다만 완성도가 아주 높은 작품이라고 생각하지는 않습니다. 과거와 현재를 오가는 방식이 때로는 인물의 감정에 충분히 다가가기보다 거리를 두는 것처럼 느껴졌고, 결말도 선명한 해답을 주지는 않습니다.

그럼에도 왠지 저와 인연이 닿는 작품 같아서 애정이 갑니다. 모든 장면이 만족스러웠던 영화는 아니지만, 보고 난 뒤에도 실비아의 기억과 마지막 바다 장면이 오래 남네요.
