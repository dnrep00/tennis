아버지의 약사

아버지께서는 왜정 3년, 서기 1912년 임자 7월 3일에 태어나셨습니다.
1961년 신축 6월 24일 아침, 향년 50세를 일기로 소천하셨습니다.

할아버지께서는 춘추 서른에 노성으로 낙향하시어 첫 따님을 두셨습니다.
이듬해 양화로 이사하시고 2년 뒤, 서른셋 늦은 연세에 첫아들을 얻으셨습니다.
그 첫아들이 아버지시니, 금지옥엽으로 여기셨답니다.

훤칠한 키에 관옥 같은 용모는 주변의 부러움을 사셨습니다.
어려서부터 익히신 한학은 주변 사람들이 따르지 못하였습니다.

1950년 육이오 동란 때는 강제 동원을 피해야 했습니다.
삼십 대 중반부터 기르신 긴 수염은 깔끔하고 보기 좋으셨습니다.

열네 살에 세 살 위 반남박씨댁 규수와 결혼하셨습니다.
열아홉에 첫아들을 보시어 모두 칠 남매를 두셨습니다.
그중 첫아들 종림과 셋째아들 종대를 똑같이 여섯 살에 잃으셨습니다.
남은 오 남매를 남의 앞에 부끄럽지 않게 키우셨습니다.

젊어서 직장에 다니실 때는 한 달에 몇 차례씩 집에 오셨습니다.
오실 때면 셈비과자와 아메다마사탕, 꿀은 물론 석유도 통으로 사 오셨습니다.
왜정 땐 구경조차 어려운 물건이라 이웃의 부러움을 샀습니다.

30대에 직장을 버리고 전국을 여행하셨습니다.
울릉도로 가는 배편을 기다리며 동해안 인구라는 작은 항구에 머무르셨습니다.
어느 날 마을 뒤 행길에 올라 석양을 등지고 인구 마을을 내려다보셨습니다.

앞바다는 푸르다 못해 검었습니다.
그 위를 나는 갈매기는 새하얗게, 바로 발아래에서 나는 듯했습니다.
저녁 짓는 초가집 굴뚝에선 하얀 연기가 모락모락 피어올랐습니다.
그 평화로운 모습을 한참 내려다보시다가 문득 집 생각이 나셨습니다.
나도 저들처럼 평화롭게 살아 보리라.
그 길로 울릉도행을 접고 집에 돌아와 농사에 힘쓰셨습니다.

얼마 뒤 왜놈들에게 보국대라는 미명으로 강제 징용되셨습니다.
대전 비행장 닦는 곳에서 고생도 하셨습니다.

돌아와 농사일을 하시는데 어찌나 열심이신지 당할 사람이 없었습니다.
뒷동산 대나무밭을 일구어 감자를 심으셨습니다.
어찌나 잘 되었던지 온 집안이 감자 투성이였습니다.

그해는 흉년인 데다 공출로 곡식을 다 빼앗겨 먹고살기가 어려웠습니다.
따로 살던 삼형제분이 한집에 모여 열일곱 명 대식구가 되었습니다.
다행히 감자가 풍년이라 곡간에 수북이 쌓아 두고 굶주림을 면하였습니다.

광복 5년 뒤, 육이오 남침으로 넉 달간 인민공화국 치하에 놓였습니다.
압박을 받던 그 시기도 연해주파의 가족 예우로 순조롭게 넘겼습니다.

1955년 봄, 상서공파 파보를 시작할 때였습니다.
옛날 족보 일을 보시던 부친의 후광으로 보소의 부름을 받으셨습니다.
보학에 밝으셔서 총무 일을 맡으셨습니다.

처음엔 무임봉사였습니다.
뒤에 반질을 하시면서 보수를 받아 생활에 보탬이 되었습니다.
이어 백사공파 파보를 주관하여 마치셨습니다.
그 뒤로 경주이씨 전 일가로부터 존경받는 어른이 되셨습니다.

그 여세로 경주이씨 대종안과 상서공파 종적부를 발기하셨습니다.
스스로 총무를 맡아 진위 선영의 상서공 설단 자금을 비축하셨습니다.
종친들의 유대를 다지는 데도 힘쓰셨습니다.
그러나 아버지께서 돌아가시자 이어갈 사람이 없어 무산되고 말았습니다.

우리 경주이씨는 삼한갑족의 명문입니다.
다만 신라 때는 모계 성을 따르는 관행이 있어 우리도 외가 성인 김씨로 행세하였습니다.
그래서 시조 이후 고려 초까지의 세계가 실전되었습니다.

아버지께서는 중국에 사는 일가가 보관했다는 실전 세계를 구하셨습니다.
국당공파 종문씨와 함께 여러 성씨의 상계와 서적을 고증하셨습니다.
그렇게 확실한 세계를 만들어 대종안과 종적부에 실어 전 종친에게 알리셨습니다.

1977년 12월에 발간된 한국인의 족보라는 만성보에도 종문씨의 투고로 등재되었습니다.
지금은 여러 서적에 실리고 있으니, 이 어른께서 이루어 놓은 큰 업적입니다.

아버지의 휘는 규 자, 빈 자입니다.
자는 공대요, 호는 송재이십니다.

하늘이 내린 효자셨습니다.
부모가 병환이 나시면 남의 손을 빌리지 않고 직접 간호와 시탕을 하셨습니다.

겨울이면 부자분이 사랑방에서 다정히 글을 읽고 담론을 나누셨습니다.
방이 차지 않도록 군불 지피는 일도 손수 하셨습니다.

해방 후 어느 해 여름이었습니다.
할아버지께서 안성 선산에 성묘를 다녀오셨습니다.
마당에 깔아 놓은 호밀짚 방석에 앉자마자 화를 내시며 고함을 치셨습니다.
산지기 놈들이 산이며 전답을 모두 제 놈들 앞으로 등기를 내 갔다는 것이었습니다.

아버지께서 내용을 자세히 여쭈어 보시고는 달래셨습니다.
그까짓 쓸모없는 산 잃었다고 그리 화를 내시다간 병환만 생기셔요.
하루 세끼 거르지 않으면 다행이지요.
그러자 잠잠하셨습니다.

참을 수 없으신지 다시 화를 내시고 고함을 치셨습니다.
그만 좀 하셔요.
그리 아까운 줄 아시는 어른이 어떻게 그 큰 집과 세전지물은 몽땅 행랑것에게 내주셨어요.
그 말에 입을 다무셨습니다.

그 시절 사회주의자 조봉암이 초대 농림부장관을 맡았습니다.
부잣집과 일본인 토지를 몰수하여 상환토지제도를 만들었습니다.
땅이 적은 농부에게 나누어 주던 때였습니다.
산지기들이 그 틈을 타 제 놈들 앞으로 등기를 내 갔다는 것입니다.

부여와 안성의 선영은 오백 리 길이라 왕래가 어려웠습니다.
막대한 경비도 감당할 수 없었습니다.
차라리 모두 잊고 마음 편히 살고 싶으셨던 것 같습니다.

지금이라면 근거가 조금만 있어도 되찾을 수 있습니다.
그러나 여러 번 이사하면서 묘적계를 헌 금고와 함께 버려 찾을 길이 없게 되었습니다.

아버지께선 당내간을 끔찍이 사랑하셨습니다.
그들의 아픔을 당신의 아픔인 양 여기셨습니다.
우애와 화목을 늘 앞세우셨습니다.

우리는 이 추도문을 통하여 이 어른의 깊은 뜻을 본받고자 합니다.
형제간에 우애하고 당내간에 화목하며, 남에게 불편을 주는 일이 없도록 살겠습니다.

좋은 일을 보거든 예찬하여 더욱 잘할 수 있도록 하겠습니다.
나쁜 일을 보거든 조용히 타일러 스스로 뉘우칠 기회를 주겠습니다.
모범스럽게 살면서 전해 내려온 가풍을 지키겠습니다.
명예로운 문중으로 후손에게 넘겨주도록 노력합시다.

맏아들 씀
