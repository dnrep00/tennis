# <남극> - 클레어 키건

평점 : ★★★☆ / 7.5

클레어 키건의 소설을 읽을 때마다 감탄하게 됩니다. 무엇을 쓰고 무엇을 생략해야 하는지 정확하게 알고 있는 작가입니다. 지금까지 읽었던 작품들이 모두 좋았기 때문에 이번에도 별다른 고민 없이 선택했습니다.

<남극>은 짧은 소설들을 모아놓은 단편집입니다. 마침 오디오북이 있어서 출퇴근길에 한 편씩 아껴서 들었네요.

클레어 키건은 1968년 아일랜드에서 태어난 작가입니다. 미국과 영국에서 문학을 공부했고, 1999년 첫 소설집 <남극>을 발표했습니다.

국내에는 <맡겨진 소녀>, <이처럼 사소한 것들>, <푸른 들판을 걷다> 등이 번역되어 있습니다. 이미 여러 번 소개했던 작가라 이력은 이 정도로 정리합니다.

<남극>은 총 15편의 단편이 수록된 첫 작품집으로, 원제는 <Antarctica>입니다. 표제작 <남극>을 비롯해 <키 큰 풀숲의 사랑>, <자매>, <여권 수프>, <폭풍> 등 15편의 단편이 실려 있습니다. 이 작품으로 루니 아일랜드 문학상을 받았다고 합니다.

표제작 <남극>은 결혼한 여성이 혼외관계에 대한 호기심으로 낯선 남자를 만나면서 벌어지는 이야기입니다. 평범한 일상에서 시작하지만, 이야기는 예상하지 못한 방향으로 흘러갑니다.

다른 작품들 역시 가족과 부부, 부모와 자식, 남녀 사이의 관계를 다룹니다. 사랑과 욕망, 외로움, 폭력, 상실 등이 반복해서 등장합니다. 아일랜드의 농촌과 가정이 주요 배경이지만, 미국을 배경으로 한 작품들도 있습니다.

특히 눈에 띄는 것은 작품 전반에 흐르는 폭력과 불안입니다. 이후 발표한 <맡겨진 소녀>나 <이처럼 사소한 것들>에서는 어려운 현실 속에서도 인간의 선의와 연민을 발견할 수 있습니다. 반면 <남극>에서는 가족과 연인 사이의 관계가 억압과 상처의 원인이 되는 경우가 많습니다.

여성 인물들의 이야기가 많은 것도 특징입니다. 가부장적인 가정에서 자신의 역할을 강요받거나, 기존의 관계에서 벗어나려는 여성들이 등장합니다. 개인의 욕망과 이를 억압하는 현실 사이의 충돌이 여러 작품에서 반복됩니다.

클레어 키건의 가장 큰 장점 중 하나는 절제된 문장이라고 생각합니다. 할 말과 하지 않을 말을 정확하게 구분하고, 감정을 직접 설명하기보다 장면으로 보여줍니다. 이런 특징이 첫 작품집인 <남극>에서부터 이미 확인된다는 점이 흥미로웠습니다. 이후 작품들보다 조금 더 거칠고 직접적인 부분도 있지만, 작가 특유의 문체와 시선은 이미 자리 잡고 있었던 것 같습니다.

이번에는 오디오북으로 들었습니다. 여러 성우가 등장인물의 감정을 살려 연기하는 방식이었는데, 듣는 재미는 있었지만 조금 아쉬웠습니다. 감정을 실어 연기하다 보니 문장이 가진 여백이 줄어드는 느낌이었습니다. 오히려 담담하게 읽었으면 더 좋았겠다는 생각을 했네요. 클레어 키건의 소설은 오디오북보다는 종이책으로 천천히 읽는 편이 더 어울릴 것 같습니다.

15편의 단편은 이번에도 한 편 한 편 모두 좋았습니다. 첫 작품집이라는 점을 생각하면 더 인상적입니다.

이제 클레어 키건의 주요 작품은 거의 다 국내에 번역되어 소개된 것 같습니다. 발표하는 작품이 많지 않은 작가라 다음 작품을 언제 만날 수 있을지는 모르겠지만, 신작이 빨리 나왔으면 좋겠네요.
