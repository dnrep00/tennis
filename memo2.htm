평점 : ★★★☆ / 7.5

<스파이더맨: 브랜드 뉴 데이>를 봤습니다. 

스파이더맨 시리즈는 계속 재미있게 봐왔기 때문에 이번에도 당연히 볼 생각이었습니다. 다만 이번엔 개봉 전후로 입소문이 좋았어서서 평소보다 기대를 얹고 극장에 갔네요.

그리고, 톰 홀랜드와 젠데이아가 커플로 연기 하는 모습을 다시 보고 싶은 마음도 있었습니다. 관심이 가서 찾아보니 처음 시리즈를 시작할 때는 아니었지만, 두 사람은 이제 실제 부부라네요. 올해 초 조용히 식을 올렸고 홀랜드가 6월 인터뷰에서 이를 인정했다고 합니다. 

공교롭게도 두 사람은 이 영화와 <오디세이>에 나란히 나옵니다. 그리고 두 작품이 국내에서 일주일 간격으로 개봉했습니다. 같은 부부가 출연한 대작 두 편을 극장 한 곳에서 연달아 볼 수 있는 신기한 여름이네요. ㅋㅋ


이번 영화의 감독은 데스틴 대니얼 크레턴입니다. 마블에서는 <샹치와 텐 링즈의 전설>을 연출했습니다. 마블 이전작들을 보면 상처를 안고 사는 사람의 이야기를 많이 다뤘다고 합니다. 그래서 그런지 이번 영화도 이 감독의 전작들과 맞닿아 있다는 생각이 드네요. 

출연진을 보면 당연히 톰 홀랜드가 피터 파커를, 젠데이아가 미셸 존스왓슨(MJ)을, 제이콥 배덜런이 네드 리즈를 맡아 세 사람 모두 돌아왔고, 세이디 싱크가 이번 작품의 핵심 인물인 진 그레이를 연기합니다. 


(여기서부터는 스포일러 구간입니다)

<노 웨이 홈>으로부터 4년 뒤, 피터는 아무도 자신을 모르는 도시에서 풀타임 스파이더맨으로 삽니다. 사람을 완전히 끊었고, 범죄를 정리한 뒤 꽃을 사서 메이 큰엄마의 묘에 가는 게 하루의 전부입니다. 그 고립의 대가로 DNA 변이가 시작되고, 손목에서 생체 거미줄이 나오면서 힘은 세지는데 통제가 안 됩니다.

동시에 사람의 몸을 옮겨 다니며 조종하는 존재가 나타납니다. 그는 MJ의 몸에 들어가 기억이 돌아온 척 연기하는 방식으로 피터를 무너뜨리고, 그제야 정체가 드러납니다. 세이디 싱크가 연기한 진 그레이입니다. 목적은 대미지 컨트롤에 끌려가 실험당한 언니 세라를 찾는 것이었습니다. 하지만 진이 알아낸 언니의 마지막 말은 유언이 아니라, 죽어가며 눈에 들어온 환풍기 브랜드 이름이었습니다. 진은 폭주합니다.

피터는 넌 스파이더맨이냐 피터 파커냐는 질문에 마스크를 벗고 답합니다. 둘 다 나야. 그리고 스스로 억제기를 떼어내며 힘을 완전히 제어합니다. 클라이맥스는 싸움이 아닙니다. 피터는 진에게 내 머릿속으로 들어오라고 말합니다. 방어가 아니라 초대입니다. 진은 피터의 정신 안에서 기억 속의 메이 큰엄마를 만나고, 그 대화 끝에 자신의 복수가 잘못됐음을 깨닫고 웁니다. 메이가 피터에게 남긴 말이 피터를 거쳐 진에게 도착한 셈입니다.

그 사실을 모르던 퍼니셔가 밖에서 진을 저격하는데, 피터가 이를 몸으로 막고 총에 맞습니다. 진은 병원에서 빙의로 피터의 호흡을 유지하다 조용히 떠납니다. 

(스포일러 끝)

이 영화가 반복하는 단어는 '기억'이 아니라 '상처'입니다.
피터도, 진도, 퍼니셔도 각자 잃은 사람이 있습니다. 셋은 능력이 아니라 상실로 서로를 알아봅니다. 진이 피터의 머릿속에서 메이를 만나는 장면이 그 구조의 정점입니다. 위로받는 쪽이던 인물이 처음으로 위로하는 쪽에 섭니다. MCU 스파이더맨이 늘 멘토에게 배우기만 했다는 걸 생각하면 의미가 있는 전환입니다.

스파이더맨은 수십 년째 만들어지고 있습니다. 실사영화만 열네 편입니다. 더 나올 게 있나 싶은 게 솔직한 심정이었습니다. 이 영화는 그 질문에 대한 대답 같습니다. 시리즈가 아직 안 끝났다는 걸, 규모를 키우는 대신 주인공을 더 파고들어서 증명합니다.

이제 성인이 된 스파이더맨은 확실히 외롭습니다. 고등학생 때의 소란스러움이 없습니다. 대신 가슴을 건드리는 구석이 생겼습니다. 아무도 자기를 모르는 도시에서 계속 일하는 사람의 얼굴은, 히어로물보다 다른 장르에 가깝습니다.

슈퍼히어로 영화인 건 맞습니다. 그런데 피터와 MJ의 관계는 로맨스처럼 보이고, 메이 큰엄마와 얽힌 부분은 휴먼 드라마처럼 보입니다. 특히 후자는 이미 죽은 사람인데도 영화 전체에 남아 있습니다. 죽은 사람의 말이 남은 사람을 통해 또 다른 사람에게 전해지는 구조를, 액션 블록버스터 한복판에 넣었습니다.

결론적으로 액션물로 충분히 재미있지만 한편으로 감정적으로도 관객을 움직이는 영화인것 같습니다. 두 가지를 같이 해내는 영화가 흔하지는 않죠. 충분히 극장에서 볼만한 영화라고 생각합니다. 

톰 홀랜드는 5편과 6편까지 계약을 마쳤다고 합니다. 다음엔 어떤 이야기가 이 스파이더맨을 기다리고 있을지 궁금하네요.
