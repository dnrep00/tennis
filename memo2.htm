<어떻게 해야 했을까?>

평점 : ★★★☆ / 7.0

솔직히 처음엔 잘 모르는 영화였습니다. 우연히 시놉시스를 보게 되었는데 조현병을 앓는 언니와, 그 언니를 병원에 보내지 않은 부모의 이야기라고 하더라고요. 그 한 줄에 마음이 갔습니다. 조현병을 앓는 가족이 있는 집은 어떤 일상을 살아갈까, 궁금했습니다. 그래서 극장을 찾았습니다.

후지노 토모아키라는 다큐멘터리 연출자라고 합니다. 아이누 민족의 인권 문제를 오래 다뤄온 감독이라고 합니다. 연구자들이 무덤에서 가져간 아이누 조상의 유골을 후손들이 되찾아 고향에 묻는 과정을 담은 단편도 만들었고, 이후에는 아이누의 연어 어업권을 다룬 <카무이쳅, 연어잡이와 선주권>도 연출했다고 합니다. 소수자의 목소리를 조용히, 오래 따라가는 게 이 감독의 스타일이라고 하더군요.

그런데 <어떻게 해야 했을까?>는 좀 다릅니다. 남의 이야기가 아니라 자기 가족의 이야기니까요. 감독 본인이 대학생 때부터 카메라를 들었고, 20년 넘게 자기 집을 찍었다고 합니다. 그 긴 기록이 그대로 영화가 된 셈입니다.

영화의 스토리는 이렇습니다. 감독에게는 8살 많은 누나가 있습니다. 그림도 잘 그리고 피아노도 치는, 매사에 야무진 사람이었습니다. 의사이자 연구자인 부모의 뒤를 따라 의대 진학을 준비합니다. 재수를 거듭하면서 조금씩 무너지네요. 결국 의대에 들어가긴 하는데, 해부 실습을 하면서 발병을 합니다. 

조현병이 의심되는 상황인데도 부모는 병을 인정하지 않습니다. 정신과 진료도 거부하고요. 감독은 부모를 설득하려 하지만 소용이 없습니다. 답답한 마음을 안은 채 결국 집을 떠나게 됩니다.

시간이 흐르고 영상 제작을 배운 감독은 본가에 갈 때마다 카메라를 챙기기 시작합니다. 식탁 풍경, 가족 나들이, 부모와의 대화를 담아냅니다.  그 사이 누나의 상태는 점점 나빠집니다. 결국 부모는 현관에 자물쇠를 채우게 됩니다. 이후의 전개는 직접 보시는 게 좋을 것 같네요.

이 영화, 개봉과 함께 이례적인 흥행을 기록했다고 합니다. 미니시어터 4관에서 시작해 전국 100개관 이상으로 확대 상영됐고, 흥행 수입도 1억 엔을 넘겼다고 하네요. 다큐멘터리로는 드문 성과라고 합니다.

감독은 한 인터뷰에서 이 영화를 "실패 사례"라고 표현했다고 합니다. 자물쇠 장면이 화제가 되면서 부모를 일방적인 가해자로만 보는 시선도 생겼다고 하는데, 감독은 이를 경계했다고 하네요. 자물쇠는 방문을 잠근 감금이라기보다, 창문으로는 나갈 수 있지만 부모의 뜻을 전하는 상징에 가까웠다고 설명했답니다. 단순한 선악 구도로 읽히지 않길 바랐던 것 같습니다.

영화를 끝까지 다보고 나니 기가 막히더군요. 화도 나구요. 

영화를 보는 내내 얼마 전 읽은 책 <물고기는 존재하지 않는다>가 자꾸 떠올랐습니다. 그 책의 주인공 데이비드 스타 조던은 평생 물고기를 분류하는 데 매달린 학자였죠. 지진으로 표본이 다 깨졌을 때도 무너지지 않고 다시 이름표를 붙였다고 합니다. 과학자로서는 존경받을 만한 태도네요. 그런데 그 집요함이 어느 순간 자기 확신으로, 나중에는 남을 해치는 신념으로 변해버립니다. 세상을 자기가 정한 질서 안에 억지로 끼워 맞추려는 사람이 되어버리는 거죠.

이 영화 속 부모도 다르지 않았습니다. 둘 다 의사이자 연구자거든요. 누구보다 과학에 가깝고, 누구보다 이성적으로 보이는 사람들입니다. 그런데 정작 자기 딸의 병 앞에서는 눈을 감아버립니다. 데이터를 믿는 사람들이 정작 눈앞의 증상은 믿지 않은 거죠. 자기 가정이 완벽하다는 믿음, 자식이 그럴 리 없다는 자존심이 판단을 가린 것 같습니다. 책 속 조던과 영화 속 부모는 전혀 다른 사람들인데, 아집에 빠지는 방식은 묘하게 닮아 있더라고요.

과학적 사실과 과학하는 태도는 다른 것 같습니다. 사실을 아는 것과, 사실 앞에서 겸손한 것은 다른 문제니까요. 이 둘을 구분하는 일이 생각보다 쉽지 않아 보입니다. 오히려 많이 배운 사람일수록 더 어려운 게 아닐까 싶기도 하네요.

이 영화 속 인물들의 경우는 좀 극단적이긴 합니다. 그래도 이런 함정은 누구나 빠질 수 있겠다는 생각이 들었어요. 자기가 옳다고 믿는 순간, 도그마는 이미 시작된 걸지도 모릅니다. 중요한 건 자만하지 않는 것, 결론이 아니라 태도를 열어두는 것 같아요. 과학적 사실을 붙잡기보다, 틀릴 수 있다는 가능성을 받아들이는 자세가 필요해 보였습니다.

극장을 나오면서 자꾸 상상하게 되더라고요. 누나가 처음부터 제대로 치료를 받았다면 어땠을까 하고요. 아마 의대로 돌아가 의사가 됐을 겁니다. 연애도 하고, 결혼도 하고, 아이도 낳고, 평범하게 사랑이 충만한 삶을 살았을 수도 있었겠죠. 그런 미래를 잃어버린 그녀의 삶이 참 안타깝게 느껴졌습니다. ㅠㅠ
