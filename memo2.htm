# <세네카, 오늘을 빼앗기고 있는 당신에게> - 2,000년 전이나 지금이나 사람 사는 건 똑같네요

평점: ★★★ / 6.5


평소 세네카의 글을 한번 읽어보고 싶었습니다. 고대 로마의 철학자가 인생과 시간에 대해 어떤 이야기를 했는지 궁금했거든요. 그러던 중 <세네카, 오늘을 빼앗기고 있는 당신에게>라는 책을 알게 됐습니다. 요즘 베스트셀러 목록에서도 자주 보이는 것 같아 관심이 갔네요.

오래전에 회사 도서관에 예약을 걸어두었는데, 마침 제 차례가 돌아왔습니다. 직접 세네카가 쓴 책은 아니지만, 그의 생각을 쉽게 접할 수 있겠다는 기대를 가지고 읽기 시작했습니다.

세네카는 기원전 4년경에 태어나 서기 65년에 사망한 고대 로마의 철학자이자 정치가입니다. 스토아 철학을 대표하는 인물 중 한 명으로, 인간의 감정과 욕망, 시간, 죽음, 행복 등에 대해 많은 글을 남겼습니다. 그는 로마 황제 네로의 스승이자 정치적 조언자로 활동했습니다. 한때 권력의 중심에 있었지만, 이후 네로와의 관계가 멀어졌고 결국 황제의 명령에 따라 스스로 목숨을 끊었습니다.

세네카의 대표적인 저작으로는 <인생의 짧음에 관하여>, <마음의 평정에 관하여>, <행복한 삶에 관하여>, <루킬리우스에게 보내는 도덕 편지> 등이 있습니다.  세네카는 철학을 단순한 지식이 아니라 삶을 살아가는 방법으로 생각했다고 합니다. 어떻게 살아야 하는지, 무엇을 두려워해야 하는지, 어떤 것에 가치를 두어야 하는지가 그의 주요 관심사였습니다.

책은 모두 5부로 구성되어 있습니다. 시간의 가치에서 시작해 감정의 통제, 고독과 성찰, 타인의 시선, 역경을 대하는 태도까지 다룹니다. 각각 다른 주제지만, 결국 자신의 삶을 스스로 통제해야 한다는 생각으로 연결됩니다.

가장 먼저 강조하는 것은 시간입니다. 사람들은 돈이나 재산을 잃는 것에는 민감하면서도 정작 자신의 시간을 빼앗기는 일에는 무관심합니다. 남의 부탁을 들어주고, 불필요한 일에 매달리고, 미래를 걱정하느라 현재를 소비합니다. 세네카는 인생이 짧은 것이 아니라 시간을 낭비하기 때문에 짧게 느껴진다고 이야기합니다. 중요한 것은 바쁘게 사는 것이 아니라 무엇을 위해 시간을 쓰고 있는지 생각하는 것입니다.

감정에 대한 이야기도 이어집니다. 우리는 일이 뜻대로 풀리지 않으면 쉽게 불안해하고 화를 냅니다. 하지만 자신을 괴롭히는 것은 사건 자체보다 그 사건을 받아들이는 태도일 수 있습니다. 외부에서 벌어지는 모든 일을 통제할 수는 없지만, 그 일에 어떻게 반응할지는 스스로 결정할 수 있다는 것이죠. 이는 자신이 통제할 수 있는 것에 집중하라는 스토아 철학의 생각과도 연결됩니다.

아무것도 하지 않는 시간에 대해서도 생각하게 합니다. 사람들은 늘 무언가를 해야 한다는 압박을 받습니다. 일을 하지 않을 때조차 새로운 자극을 찾습니다. 하지만 바쁘게 움직인다고 반드시 의미 있는 삶을 사는 것은 아닙니다. 때로는 멈춰서 자신이 무엇을 원하는지 돌아볼 필요가 있습니다.

다른 사람의 시선과 사회적 통념을 따르는 삶도 경계합니다. 많은 사람이 선택한 길이라고 반드시 올바른 길은 아닙니다. 남들이 성공이라고 부르는 것을 좇다 보면 정작 자신이 원하는 삶과 멀어질 수 있습니다. 중요한 것은 타인의 평가가 아니라 스스로 세운 기준이라는 이야기입니다.

마지막으로 역경과 고통을 대하는 태도를 이야기합니다. 누구나 편안한 삶을 원하지만, 어려움이 반드시 불행만을 의미하지는 않습니다. 시련을 통해 자신을 돌아보고 성장할 수도 있습니다. 재산과 지위, 명예는 언제든 사라질 수 있지만 자신의 판단과 태도는 스스로 다듬어갈 수 있습니다. 결국 중요한 것은 어떤 일이 벌어지느냐보다 그 일을 어떻게 받아들이느냐에 있다는 것입니다.

세네카의 철학을 처음 접하기에는 부담 없는 책입니다. 고대 로마 철학자의 이야기를 현대적인 언어로 풀어놓았기 때문에 어렵지 않게 읽을 수 있었습니다. 다만 세네카의 사상을 제대로 이해하기 위한 책으로는 조금 아쉽습니다. 원전을 그대로 옮기기보다는 현대인의 고민에 맞춰 편역하고 재구성한 글들이라, 세네카 철학의 전체적인 면모를 파악하기에는 한계가 있어 보입니다. 철학서라기보다는 세네카의 생각을 소재로 한 자기계발서에 가깝다는 느낌이었습니다.

내용 자체도 크게 새롭지는 않았습니다. 시간을 소중히 쓰고, 남과 비교하지 말고, 감정을 다스리고, 어려움을 피하지 말라는 이야기입니다. 대부분 상식적으로 알고 있는 내용이죠. 그래서 책을 읽는 동안 철학자의 깊이 있는 사유를 따라간다기보다는, 인생 경험이 많은 나이 든 선배에게 조언을 듣는 느낌이었습니다. 틀린 말은 없고 충분히 공감도 되지만, 그렇다고 새로운 깨달음이 이어지는 것은 아니었습니다.

그나저나 책을 읽으면서 가장 많이 들었던 생각은 "2,000년 전이나 지금이나 사람 사는 건 정말 똑같구나" 하는것 입니다. 어쩌면 그렇게 그때나 지금이나 사람들의 고민은 똑같은건지.... 신기하네요.

책을 덮고 나니 세네카의 철학을 제대로 읽어보고 싶다는 생각은 오히려 더 커졌습니다. 다음에는 편역서가 아니라 <인생의 짧음에 관하여>나 <루킬리우스에게 보내는 도덕 편지> 같은 원전 번역서를 읽어봐야겠습니다.
