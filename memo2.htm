# <올 그린스> 리뷰: 웃자고 한 이야기에 죽자고 달려들 필요는 없습니다

평점 : ★★★☆ / 7.0

개봉 소식을 듣고 볼까 말까 고민했던 영화입니다. 다른 영화를 먼저 챙겨 보다 보니 어느새 극장에서 내려가 있었네요. CGV 단독 개봉이라 상영관도 많지 않았습니다.

그러다 최근 고레에다 히로카즈 감독의 실사판 <룩백>을 봤습니다. 후지노 역의 데구치 나츠키 배우가 눈에 들어왔네요. 다른 작품도 궁금해졌는데, 마침 <올 그린스>가 OTT에 올라왔더군요. 지금은 왓챠에서 볼 수 있습니다. 이번엔 미루지 않고 바로 봤습니다.

코야마 다카시 감독은 국내에는 아직 낯선 이름입니다. CM 제작, 조감독, 편집 일을 거쳐 2015년에 독립했다고 합니다. 2021년 <사루가쿠초에서 만나요>로 극장 영화에 데뷔했고, <올 그린스>는 두 번째 장편입니다.

원작은 소설입니다. 마쓰모토 세이초상을 만장일치로 받은 나미키 도의 동명 소설을 영화로 옮겼습니다. 작가는 1999년생이고, 스무 살에 이 작품으로 데뷔했습니다. 일본 원제는 <万事快調>, '만사 순조'라는 뜻입니다.

감독이 밝힌 참고작이 의외입니다. 일본 청춘 영화가 아니라 <파이트 클럽>을 참고했다고 합니다. 청춘 영화는 자칫 촌스러워질 수 있다고 보고, 건조하고 쿨한 톤을 목표로 했다고 하네요.

### 스토리 라인

배경은 이바라키현 도카이무라입니다. 감독의 고향이자, 1999년 핵연료 처리 시설 사고로 알려진 마을입니다. 이렇다 할 미래가 보이지 않는 시골 동네입니다. 고등학교를 마치면 동네 사람과 결혼해 아이를 낳고 사는 것이 정해진 길처럼 보이는 곳입니다.

주인공은 세 명의 여고생입니다. 보쿠 히데미(미나미 사라)는 래퍼를 꿈꿉니다. 학교에도 집에도 마음 둘 곳이 없습니다. 고가도로 아래 공터에서 또래들과 프리스타일 랩을 하며 하루하루를 버팁니다. 누구도 쉽게 믿지 않고, 늘 화가 나 있는 아이입니다.

야구치 미루쿠(데구치 나츠키)는 반대편에 있는 아이입니다. 육상부 에이스이고 사교적이며 선생님과 친구들 모두에게 인기가 많습니다. 영화를 좋아하는 아이이기도 합니다. 히데미는 그런 미루쿠가 마음에 들지 않습니다.

이와쿠마 마코(요시다 미즈키)는 만화에 해박하고 입이 험한 캐릭터입니다. 볼링장에서 아르바이트를 하며 지냅니다. 셋 중 가장 시니컬합니다.

처음에 셋은 친구라고 하기 어려운 사이입니다. 거리가 좁혀지는 건 미루쿠가 실습 중 사고로 다치면서부터입니다. 이 일을 계기로 히데미와 미루쿠는 조금씩 이야기를 나누게 됩니다. 다만 미루쿠는 집 이야기만큼은 꺼내지 않습니다. 밝은 얼굴 뒤에 꽤 복잡한 가정사가 있다는 것이 서서히 드러납니다.

히데미에게도 숨기고 싶은 일이 있습니다. 함께 작업하자는 프로듀서의 제안을 믿고 찾아갔다가 위험한 일을 겪을 뻔합니다. 그 사건이 엉뚱하게 흘러가면서 히데미는 대마 씨앗을 손에 넣게 됩니다. 사고가 기회로 바뀌는 순간입니다.

셋의 목표는 단순합니다. 한탕 크게 벌어서 이 동네를 뜨는 것. 히데미는 미루쿠와 마코를 끌어들여 학교에 원예 동아리를 만듭니다. 동아리 이름이 '올 그린스'입니다. 학교에서 겉도는 다른 아이들의 손을 빌려 옥상 비닐하우스를 손보고, 씨앗을 심고, 정성껏 키웁니다. 겉으로는 성실한 동아리 활동입니다.

수확이 시작되자 돈이 들어옵니다. 계획은 생각보다 잘 굴러갑니다. 셋은 처음으로 이 동네를 떠나는 그림을 구체적으로 그려봅니다.

하지만 순조로운 시간은 길지 않습니다. 돈이 쌓일수록 비밀을 지켜야 하는 부담도 커집니다. 동네의 거친 선배들, 각자의 집안 문제 같은 현실이 하나둘 끼어듭니다. 불안과 욕심이 커지면서 셋의 관계도 흔들리기 시작합니다. 이들이 과연 이 동네를 벗어날 수 있을지가 후반부를 끌고 갑니다.

### 개인적인 감상

소재가 소재인 만큼 호불호는 갈릴 수 있습니다. 고등학생이 대마를 재배하고 판다는 설정입니다. 영화는 이걸 무겁게 다루지 않습니다. 범죄극의 정밀함보다 청춘극의 에너지를 택했고, 그 대가로 서사가 다소 허술하다는 평도 있네요. 현실적인 개연성을 기대하면 아쉬울 수 있습니다.

'올 그린스'는 비닐하우스의 초록 식물을 가리키면서, 동시에 '모든 신호가 초록불'이라는 느낌을 줍니다. 원제 '만사 순조'도 마찬가지입니다. 하는 일이 전부 위태로운데 제목은 다 잘 되고 있다고 말합니다. 이 아이러니가 영화의 태도에 가깝습니다.

감독도 비슷한 이야기를 했습니다. 이 영화의 매력은 비장함이 없다는 점이고, 힘든 현실을 웃으며 피해 가는 경쾌한 감각을 중요하게 생각했다고 합니다.

데구치 나츠키 때문에 본 영화라 그런지 계속 그쪽으로 눈이 갔습니다. 표정이 정말 다양한 배우네요. 밝게 웃다가도 순간 그늘이 스칩니다. 반에서 인기 많은 아이의 얼굴과 집에서의 얼굴이 다릅니다. 그 차이를 표정 하나로 보여줍니다. <룩백>의 후지노와는 또 다른 얼굴이라 반가웠습니다.

솔직히 다소 도발적인 영화입니다. 조금은 말이 안 된다 싶은 장면도 있습니다. 그런데 이 영화는 그게 포인트가 아닌 것 같습니다.

어두운 상황 속에서도 아이들은 재기 발랄합니다. 도발적이지만 어딘가 귀엽습니다. 그런 아이들의 이야기를 지켜보는 느낌이라 좋았습니다.

웃자고 떠든 이야기에 죽자고 달려들고 싶지는 않습니다. 깊게 따지지 않고 딱 이 정도로 보는 게 이 영화를 제일 잘 즐기는 방법 같네요.
