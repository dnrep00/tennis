배경은 이란 남동부의 메마른 마을 구란케시입니다. 호르무즈 해협에서 멀지 않은 차바하르 지역입니다. 다부드 솔란은 이 마을 학교의 유일한 교사입니다. 임시 계약직인 그는 학기가 끝나는 석 달 뒤 정규직이 될 예정입니다. 그 돈으로 어머니와 살 집을 마련하는 게 꿈이고요.

문제는 점심 급식입니다. 급식은 정부가 아니라 한 후원자의 돈으로 운영됐는데, 그 후원자가 세상을 떠납니다. 유족은 후원을 이어갈 생각이 없습니다. 아이들은 사실 공부보다 점심 때문에 학교에 옵니다. 급식이 끊기면 아이들이 안 오고, 학교는 문을 닫게 됩니다. 정규직의 꿈도 함께 사라지죠.

교육청은 도움 대신 수업을 계속하라는 지시만 내립니다. 솔란은 집 보증금을 빼서 어머니와 함께 학교로 이사합니다. 그리고 낮에는 교사로, 밤에는 기름 밀수꾼으로 이중생활을 시작합니다. 이 지역에서는 아이들까지 연료 밀수를 할 만큼 흔한 일입니다. 솔란은 거물들이 같은 일로 벌어들이는 돈에 비하면 자기 밀수는 아무것도 아니라고 항변하지만, 경찰에게서는 학생들에게 나쁜 본보기라는 꾸지람을 듣습니다. 그동안 어머니는 아이들 점심을 만들며 묵묵히 아들 곁을 지킵니다. 아들의 선택에 한 번도 토를 달지 않습니다.

솔란은 처음엔 좋은 사람입니다. 아이들을 돌보고, 아픈 마을 사람에게 주사를 놔주고, 일꾼들과 빵을 나눕니다. 하지만 상황은 점점 그를 바꿉니다. 다른 마을 아이를 받는 걸 망설이고, 손님에게 음식을 내준 어머니에게 화를 냅니다. 은행 대출 보증을 부탁한 사람에게서는 이제 착한 일 하던 시절은 끝났다는 말을 듣습니다. 그가 하는 일이 정말 아이들을 위한 것인지, 정규직 월급을 위한 것인지 묻는 사람도 나타납니다.

그러다 아픈 노인 한 명이 솔란에게 맡겨집니다. 솔란은 노인을 돌보면서 관객에게도 쉽게 드러내지 않는 선택을 이어갑니다. 그리고 노인을 위해 무덤까지 미리 파 둡니다. 그런데 이야기는 엉뚱한 곳으로 흘러갑니다. 늘 곁을 지키던 어머니가 위태로워지고, 노인을 위해 판 무덤에 어머니가 들어갈 수도 있는 상황이 됩니다.

그리고 폭풍우가 몰아치는 밤이 찾아옵니다. 창고에 쌓아 둔 음식들이 비를 맞아 못 쓰게 되어 갑니다. 그 와중에 어머니는 숨이 넘어갈 듯한 노인을 챙기고, 솔란은 그런 어머니를 보며 폭발합니다. 이때 노인을 이전에 돌보던 사람이 찾아옵니다. 솔란 때문에 정부 지원금을 못 받게 됐다며 그를 때립니다. 싸움 속에서 솔란은 끝내 속내를 털어놓고 맙니다. 노인이 죽어야 장례식에 들어오는 음식으로 아이들 점심을 먹일 수 있다는 것이죠. 아이들을 먹이겠다는 선의가 한 사람의 죽음을 기다리는 데까지 와 버린 겁니다.

비가 내리는 가운데, 어머니는 싸움에서 얻어맞은 아들을 씻겨 줍니다. 그리고 자신이 간직해 온 패물을 꺼내 쓰라며 아들에게 내어 줍니다. 아들이 가장 추한 속내를 드러낸 바로 그 순간에, 어머니는 아무것도 따지지 않고 자기에게 남은 마지막 것을 건넵니다.

폭우가 그치고, 어머니는 세상을 떠납니다. 마을 사람들은 어머니의 장례식에 많은 양의 식량을 부조합니다. 솔란이 노인의 죽음으로 얻기를 바랐던 바로 그것을, 결국 어머니의 죽음으로 얻게 된 것입니다. 노인을 위해 파 두었던 무덤이 어머니의 자리가 될지도 모른다는 불길한 예감은 그렇게 현실이 됩니다.

어머니는 마지막까지 아들의 흠을 씻겨 주었고, 아들에게 필요한 모든 것을 끝까지 내어 주었습니다. 패물을 건넸고, 마지막에는 자신의 죽음으로 아이들의 점심까지 마련해 주었습니다. 존엄을 잃고 스스로를 구할 방법조차 모르게 된 아들을 어머니는 끝내 외면하지 않습니다. 아들의 잘못을 부정하지 않지만, 그 잘못 뒤에 있는 사람을 끝까지 바라봅니다. 그녀의 사랑이 아들이 한 선택의 결과까지 지워 주지는 못합니다. 다만 스스로 사랑받을 자격이 없다고 느끼는 순간에도, 여전히 사랑받을 자리를 남겨 줍니다. 저는 이 부분이 영화에서 가장 감동적이었습니다.

이후 학교에는 감사가 나옵니다. 깐깐해 보이던 감사관은 솔란의 진심을 알아보고 나름대로 돕기로 합니다. 영화는 메마른 산을 비추며 시작해서, 작은 수확이 이뤄지는 푸른 채소밭을 내려다보며 끝납니다. 몇 달 사이 이 사람들의 삶이 얼마나 달라졌는지를 보여 주는 동시에, 그 수확을 얻기까지 치른 대가를 떠올리게 하는 장면입니다.
